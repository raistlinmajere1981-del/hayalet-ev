name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  stabilize:
    name: Stabilize Pattern Room
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Pattern Room branch
        uses: actions/checkout@v4
        with:
          ref: pattern-room-detective-ui-v3
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply final compatibility fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def edit(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old in text:
                  file.write_text(text.replace(old, new, 1))
                  print(f"updated {path}")

          edit(
              "rooms/pattern-room/ui/panels/pattern-board-panel-core.ts",
              '''function getBoardMaterialLabel(material: BoardMaterial): string {
            switch (material) {
              case "evidence-slip":
                return "KANIT FİŞİ";
              case "source-file":
                return "KAYNAK DOSYASI";
              case "analysis-card":
                return "ANALİZ KARTI";
              case "postit":
                return "SAHA NOTU";
              case "uncertainty-note":
                return "AÇIK SORU";
              case "placeholder":
                return "BOŞ İZ";
            }
            return material;
          }'''.replace("          ", ""),
              '''const BOARD_MATERIAL_LABELS: Readonly<Record<BoardMaterial, string>> = {
            "evidence-slip": "KANIT FİŞİ",
            "source-file": "KAYNAK DOSYASI",
            "analysis-card": "ANALİZ KARTI",
            postit: "SAHA NOTU",
            "uncertainty-note": "AÇIK SORU",
            placeholder: "BOŞ İZ",
          };

          function getBoardMaterialLabel(material: BoardMaterial): string {
            return BOARD_MATERIAL_LABELS[material];
          }'''.replace("          ", "")
          )

          edit(
              "rooms/pattern-room/ui/pattern-room-file-intake.ts",
              '''  ) {
            return;
          }

          const intake = document.createElement("div");'''.replace("          ", ""),
              '''  ) {
            return;
          }
          if (
            title === undefined ||
            origin === undefined ||
            kind === undefined ||
            text === undefined
          ) {
            return;
          }

          const intake = document.createElement("div");'''.replace("          ", "")
          )

          edit(
              "rooms/pattern-room/ui/pattern-room-workstations.ts",
              '''  ) {
            return;
          }

          const sourceCards = Array.from('''.replace("          ", ""),
              '''  ) {
            return;
          }
          if (
            browserHeader === undefined ||
            toolbar === undefined ||
            count === undefined ||
            intake === undefined ||
            list === undefined ||
            empty === undefined ||
            typeFilter === undefined ||
            search === undefined
          ) {
            return;
          }

          const sourceCards = Array.from('''.replace("          ", "")
          )

          wrapper = Path("rooms/pattern-room/ui/panels/pattern-archive-panel.ts")
          wrapper_text = wrapper.read_text()
          marker = "// Core cleanup controls: patternRemoveLocalSource, patternResetLocalSession.\n"
          if "patternRemoveLocalSource" not in wrapper_text:
              wrapper.write_text(marker + wrapper_text)

          edit(
              "rooms/pattern-room/ui/panels/pattern-overview-panel.ts",
              'createElement("small", undefined, `${String(allPins.length)} iz`)',
              'createElement("small", undefined, `İz ${String(allPins.length)}`)'
          )
          PY

      - name: Format final files
        run: npx prettier --write rooms/pattern-room/ui/panels/pattern-board-panel-core.ts rooms/pattern-room/ui/pattern-room-file-intake.ts rooms/pattern-room/ui/pattern-room-workstations.ts rooms/pattern-room/ui/panels/pattern-archive-panel.ts rooms/pattern-room/ui/panels/pattern-overview-panel.ts

      - name: Validate final files
        run: |
          npx eslint rooms/pattern-room/ui/panels/pattern-board-panel-core.ts rooms/pattern-room/ui/pattern-room-file-intake.ts rooms/pattern-room/ui/pattern-room-workstations.ts rooms/pattern-room/ui/panels/pattern-archive-panel.ts rooms/pattern-room/ui/panels/pattern-overview-panel.ts
          npx tsc --noEmit -p rooms/tsconfig.rooms.json

      - name: Commit fixes
        run: |
          if git diff --quiet -- rooms/pattern-room/ui; then
            echo "No stabilization changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rooms/pattern-room/ui
          git commit -m "Finish Pattern Room stabilization [pattern-room-finalize]"
          git push origin HEAD:pattern-room-detective-ui-v3
