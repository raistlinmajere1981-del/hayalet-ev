name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format Pattern Room detective changes
        run: npx prettier --write rooms/pattern-room/ui/detective-room-revision.css rooms/pattern-room/ui/panels/pattern-board-panel.ts

      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet -- rooms/pattern-room/ui/detective-room-revision.css rooms/pattern-room/ui/panels/pattern-board-panel.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rooms/pattern-room/ui/detective-room-revision.css rooms/pattern-room/ui/panels/pattern-board-panel.ts
            git commit -m "Format Pattern Room detective UI"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Run strict lint
        run: npm run lint:strict

      - name: Run TypeScript checks
        continue-on-error: true
        run: npm run check-types

      - name: Run room core regressions
        if: always()
        run: npm run rooms:test:core

      - name: Build workspace rooms
        if: always()
        run: npm run rooms:build
