name: Pattern Room Stabilizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  stabilize:
    if: github.event.pull_request.head.ref == 'pattern-room-detective-ui-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Pattern Room branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply targeted stabilization fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function edit(path, transform) {
            const before = fs.readFileSync(path, 'utf8');
            const after = transform(before);
            if (after === before) {
              console.log(`No targeted change needed: ${path}`);
              return;
            }
            fs.writeFileSync(path, after);
            console.log(`Updated: ${path}`);
          }

          function replaceRequired(source, from, to, path) {
            if (!source.includes(from)) {
              throw new Error(`Expected source fragment not found in ${path}: ${from.slice(0, 90)}`);
            }
            return source.replace(from, to);
          }

          const boardCore = 'rooms/pattern-room/ui/panels/pattern-board-panel-core.ts';
          edit(boardCore, (source) => {
            source = replaceRequired(
              source,
              '    case "placeholder":\n      return "BOŞ İZ";\n  }\n}',
              '    case "placeholder":\n      return "BOŞ İZ";\n  }\n  return material;\n}',
              boardCore
            );
            return source
              .replaceAll('window.localStorage?.getItem(', 'window.localStorage.getItem(')
              .replaceAll('window.localStorage?.setItem(', 'window.localStorage.setItem(')
              .replaceAll('window.localStorage?.removeItem(', 'window.localStorage.removeItem(');
          });

          const overview = 'rooms/pattern-room/ui/panels/pattern-overview-panel.ts';
          edit(overview, (source) => {
            source = source
              .replace('createElement("input", "pattern-room-inline-input") as HTMLInputElement', 'createElement("input", "pattern-room-inline-input")')
              .replace('createElement("textarea", "pattern-room-inline-input") as HTMLTextAreaElement', 'createElement("textarea", "pattern-room-inline-input")')
              .replace('createElement("button", "pattern-room-command-capture-submit") as HTMLButtonElement', 'createElement("button", "pattern-room-command-capture-submit")');
            source = replaceRequired(
              source,
              '      file.style.setProperty("--pattern-command-file-index", String(index));',
              '      file.setAttribute("style", `--pattern-command-file-index:${String(index)}`);',
              overview
            );
            return replaceRequired(
              source,
              '    folio.style.setProperty("--pattern-command-folio-index", String(index));',
              '    folio.setAttribute("style", `--pattern-command-folio-index:${String(index)}`);',
              overview
            );
          });

          const workflow = 'rooms/pattern-room/ui/pattern-room-workflow.ts';
          edit(workflow, (source) => replaceRequired(
            source,
            '  if (panel === null || panel === undefined || header === null || header === undefined) {',
            '  if (panel === null || header === null || header === undefined) {',
            workflow
          ));

          const workstations = 'rooms/pattern-room/ui/pattern-room-workstations.ts';
          edit(workstations, (source) => {
            source = source
              .replace('querySelector<HTMLElement>(".pattern-room-role-id")?.textContent?.trim()', 'querySelector<HTMLElement>(".pattern-room-role-id")?.textContent.trim()')
              .replace('querySelector<HTMLElement>("strong")?.textContent?.trim()', 'querySelector<HTMLElement>("strong")?.textContent.trim()');
            return replaceRequired(
              source,
              '  const panels = Array.from(root.querySelectorAll<HTMLElement>(selector));\n  if (root instanceof HTMLElement && root.matches(selector)) {\n    panels.unshift(root);\n  }',
              '  const panels = Array.from(root.querySelectorAll<HTMLElement>(selector));\n  const rootPanel = root as ParentNode & {\n    dataset?: Record<string, string | undefined>;\n  };\n  if (rootPanel.dataset?.["patternView"] === viewId) {\n    panels.unshift(rootPanel as HTMLElement);\n  }',
              workstations
            );
          });

          const boardInteractions = 'rooms/pattern-room/ui/pattern-room-board-interactions.ts';
          edit(boardInteractions, (source) => {
            source = replaceRequired(
              source,
              'function isTypingTarget(target: EventTarget | null): boolean {\n  return (\n    target instanceof HTMLInputElement ||\n    target instanceof HTMLTextAreaElement ||\n    target instanceof HTMLSelectElement ||\n    (target instanceof HTMLElement && target.isContentEditable)\n  );\n}',
              'function isTypingTarget(target: EventTarget | null): boolean {\n  if (target === null) {\n    return false;\n  }\n  const element = target as EventTarget & {\n    isContentEditable?: boolean;\n    matches?: (selector: string) => boolean;\n  };\n  return (\n    element.isContentEditable === true ||\n    (typeof element.matches === "function" && element.matches("input, textarea, select"))\n  );\n}',
              boardInteractions
            );
            source = replaceRequired(
              source,
              'function syncStringLabelRotation(string: HTMLButtonElement, label: HTMLElement): void {\n  const match = /rotate\\((-?[\\d.]+)deg\\)/u.exec(string.style.transform);\n  const angle = match === null ? 0 : Number(match[1]);\n  label.style.transform = `translate(-50%, -50%) rotate(${String(-angle)}deg)`;\n}',
              'function syncStringLabelRotation(string: HTMLButtonElement, label: HTMLElement): void {\n  const styleText = string.getAttribute("style") ?? "";\n  const match = /rotate\\((-?[\\d.]+)deg\\)/u.exec(styleText);\n  const angle = match === null ? 0 : Number(match[1]);\n  label.setAttribute("style", `transform:translate(-50%, -50%) rotate(${String(-angle)}deg);`);\n}',
              boardInteractions
            );
            return replaceRequired(
              source,
              'export function enhancePatternBoardInteractions(root: ParentNode): void {\n  if (root instanceof HTMLElement && root.matches(".pattern-room-detective-board")) {\n    enhanceBoard(root);\n  }\n  root.querySelectorAll<HTMLElement>(".pattern-room-detective-board").forEach(enhanceBoard);\n}',
              'export function enhancePatternBoardInteractions(root: ParentNode): void {\n  root.querySelectorAll<HTMLElement>(".pattern-room-detective-board").forEach(enhanceBoard);\n}',
              boardInteractions
            );
          });
          NODE

      - name: Format Pattern Room
        run: npx prettier --write "rooms/pattern-room/ui/**/*.{ts,css,html}"

      - name: Apply safe ESLint fixes
        run: npx eslint --fix "rooms/pattern-room/ui/**/*.{ts,js}"

      - name: Commit stabilization changes
        run: |
          if git diff --quiet -- rooms/pattern-room/ui; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rooms/pattern-room/ui
          git commit -m "Stabilize Pattern Room CI [pattern-room-autofix]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
