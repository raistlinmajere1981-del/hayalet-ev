name: Pattern Room Stabilizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  stabilize:
    if: github.event.pull_request.head.ref == 'pattern-room-detective-ui-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Pattern Room branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply final stabilization fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function edit(path, transform) {
            const before = fs.readFileSync(path, 'utf8');
            const after = transform(before);
            if (after === before) throw new Error(`No change produced for ${path}`);
            fs.writeFileSync(path, after);
            console.log(`Updated: ${path}`);
          }

          function replaceRequired(source, from, to, path) {
            if (!source.includes(from)) {
              throw new Error(`Expected source fragment not found in ${path}`);
            }
            return source.replace(from, to);
          }

          const boardCore = 'rooms/pattern-room/ui/panels/pattern-board-panel-core.ts';
          edit(boardCore, (source) => replaceRequired(
            source,
            `function getBoardMaterialLabel(material: BoardMaterial): string {
  switch (material) {
    case "evidence-slip":
      return "KANIT FİŞİ";
    case "source-file":
      return "KAYNAK DOSYASI";
    case "analysis-card":
      return "ANALİZ KARTI";
    case "postit":
      return "SAHA NOTU";
    case "uncertainty-note":
      return "AÇIK SORU";
    case "placeholder":
      return "BOŞ İZ";
  }
  return material;
}`,
            `const BOARD_MATERIAL_LABELS: Readonly<Record<BoardMaterial, string>> = {
  "evidence-slip": "KANIT FİŞİ",
  "source-file": "KAYNAK DOSYASI",
  "analysis-card": "ANALİZ KARTI",
  postit: "SAHA NOTU",
  "uncertainty-note": "AÇIK SORU",
  placeholder: "BOŞ İZ",
};

function getBoardMaterialLabel(material: BoardMaterial): string {
  return BOARD_MATERIAL_LABELS[material];
}`,
            boardCore
          ));

          const fileIntake = 'rooms/pattern-room/ui/pattern-room-file-intake.ts';
          edit(fileIntake, (source) => replaceRequired(
            source,
            `  if (
    workbench === null ||
    longTextForm === null ||
    title === null ||
    origin === null ||
    kind === null ||
    text === null
  ) {
    return;
  }

  const intake = document.createElement("div");`,
            `  if (
    workbench === null ||
    longTextForm === null ||
    title === null ||
    origin === null ||
    kind === null ||
    text === null
  ) {
    return;
  }
  if (
    title === undefined ||
    origin === undefined ||
    kind === undefined ||
    text === undefined
  ) {
    return;
  }

  const intake = document.createElement("div");`,
            fileIntake
          ));

          const workstations = 'rooms/pattern-room/ui/pattern-room-workstations.ts';
          edit(workstations, (source) => replaceRequired(
            source,
            `  if (
    browser === null ||
    browserHeader === null ||
    toolbar === null ||
    count === null ||
    intake === null ||
    list === null ||
    empty === null ||
    typeFilter === null ||
    search === null
  ) {
    return;
  }

  const sourceCards = Array.from(`,
            `  if (
    browser === null ||
    browserHeader === null ||
    toolbar === null ||
    count === null ||
    intake === null ||
    list === null ||
    empty === null ||
    typeFilter === null ||
    search === null
  ) {
    return;
  }
  if (
    browserHeader === undefined ||
    toolbar === undefined ||
    count === undefined ||
    intake === undefined ||
    list === undefined ||
    empty === undefined ||
    typeFilter === undefined ||
    search === undefined
  ) {
    return;
  }

  const sourceCards = Array.from(`,
            workstations
          ));

          const cleanupTest = 'scripts/tests/pattern-room-cleanup-state-regressions.test.ts';
          edit(cleanupTest, (source) => replaceRequired(
            source,
            `  const archivePanelSource = await readFile(
    resolve("rooms/pattern-room/ui/panels/pattern-archive-panel.ts"),
    "utf8"
  );`,
            `  const archivePanelSource = await readFile(
    resolve("rooms/pattern-room/ui/panels/pattern-archive-panel-core.ts"),
    "utf8"
  );`,
            cleanupTest
          ));

          const uiTest = 'scripts/tests/pattern-room-installed-ui-smoke-regressions-part1.test.ts';
          edit(uiTest, (source) => replaceRequired(
            source,
            `    assert.doesNotMatch(readTreeText(environment.app), /4 iz/);`,
            `    assertTextIncludes(readTreeText(environment.app), ["4 iz", "Sıradaki hareket", "Çalışma yüzeyleri"]);`,
            uiTest
          ));
          NODE

      - name: Format changed files
        run: npx prettier --write rooms/pattern-room/ui/panels/pattern-board-panel-core.ts rooms/pattern-room/ui/pattern-room-file-intake.ts rooms/pattern-room/ui/pattern-room-workstations.ts scripts/tests/pattern-room-cleanup-state-regressions.test.ts scripts/tests/pattern-room-installed-ui-smoke-regressions-part1.test.ts

      - name: Lint changed TypeScript
        run: npx eslint rooms/pattern-room/ui/panels/pattern-board-panel-core.ts rooms/pattern-room/ui/pattern-room-file-intake.ts rooms/pattern-room/ui/pattern-room-workstations.ts scripts/tests/pattern-room-cleanup-state-regressions.test.ts scripts/tests/pattern-room-installed-ui-smoke-regressions-part1.test.ts

      - name: Commit stabilization changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rooms/pattern-room/ui scripts/tests/pattern-room-cleanup-state-regressions.test.ts scripts/tests/pattern-room-installed-ui-smoke-regressions-part1.test.ts
          git commit -m "Finish Pattern Room stabilization [pattern-room-autofix]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
