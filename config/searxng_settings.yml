# Hayalet-ev SearXNG Configuration
# Docs: https://docs.searxng.org/admin/settings/

use_default_settings: true

general:
  debug: false
  instance_name: "Hayalet-ev Search"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "tr-TR"
  languages:
    - tr-TR
    - en-US
    - all
  formats:
    - html
    - json  # MCP için gerekli

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "hayalet-ev-secret-key-change-me"
  limiter: false  # Local kullanım için rate limit kapalı
  image_proxy: true
  method: "GET"

ui:
  static_use_hash: true
  default_theme: simple
  theme_args:
    simple_style: dark
  results_on_new_tab: false
  infinite_scroll: true

redis:
  url: redis://127.0.0.1:6380/0

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20

# Arama motorları konfigürasyonu
engines:
  # Google - en kapsamlı sonuçlar
  - name: google
    engine: google
    shortcut: g
    disabled: false
    weight: 1.5

  # Bing - alternatif sonuçlar
  - name: bing
    engine: bing
    shortcut: b
    disabled: false
    weight: 1.0

  # DuckDuckGo - privacy focused
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
    weight: 1.0

  # Wikipedia - bilgi kaynağı
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
    weight: 1.2

  # GitHub - kod araması
  - name: github
    engine: github
    shortcut: gh
    disabled: false
    categories: [it, repos]
    weight: 1.0

  # Stack Overflow - programlama soruları
  - name: stackoverflow
    engine: stackexchange
    shortcut: so
    api_site: stackoverflow
    disabled: false
    categories: [it, q&a]
    weight: 1.3

  # MDN - web dokümantasyonu (devre dışı - engine yok)
  # - name: mdn
  #   engine: mdn
  #   shortcut: mdn
  #   disabled: false
  #   categories: [it]
  #   weight: 1.2

  # npm - paket araması
  - name: npm
    engine: npm
    shortcut: npm
    disabled: false
    categories: [it, packages]
    weight: 1.0

  # PyPI - Python paketleri
  - name: pypi
    engine: pypi
    shortcut: pypi
    disabled: false
    categories: [it, packages]
    weight: 1.0

  # Arch Wiki - Linux dokümantasyonu
  - name: archwiki
    engine: archlinux
    shortcut: arch
    disabled: false
    categories: [it]
    weight: 1.0

  # Google Scholar - akademik makaleler
  - name: google scholar
    engine: google_scholar
    shortcut: gs
    disabled: false
    categories: [science]
    weight: 1.0

  # Wolfram Alpha - hesaplamalar (devre dışı - API key gerekli)
  # - name: wolfram alpha
  #   engine: wolframalpha_api
  #   shortcut: wa
  #   disabled: true
  #   weight: 1.0

categories_as_tabs:
  general:
  images:
  videos:
  news:
  it:
  science:
