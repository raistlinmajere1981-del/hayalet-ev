# SearXNG Settings - Hayalet-ev Optimized
# Updated: 2026-01-24 - Fixed engine names

use_default_settings: true

server:
  secret_key: "hayalet-ev-searxng-secret-key-2024"
  limiter: false
  image_proxy: true
  port: 8080
  bind_address: "0.0.0.0"

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "en-US"
  formats:
    - html
    - json

ui:
  static_use_hash: true
  default_theme: simple
  results_on_new_tab: false

engines:
  # ===== GENERAL =====
  - name: google
    engine: google
    shortcut: g
    disabled: false
    weight: 1.3
    
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
    weight: 1.0
    
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
    weight: 1.2
    
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
    weight: 1.2
    
  - name: qwant
    engine: qwant
    shortcut: qw
    disabled: false
    weight: 0.8

  # ===== WIKIPEDIA =====
  - name: wikipedia
    engine: wikipedia
    shortcut: w
    disabled: false
    weight: 1.4

  # ===== IT & PROGRAMMING =====
  - name: github
    engine: github
    shortcut: gh
    disabled: false
    weight: 1.3
    categories: it
    
  - name: npm
    engine: npm
    shortcut: npm
    disabled: false
    weight: 0.9
    categories: it
    
  - name: pypi
    engine: pypi
    shortcut: pypi
    disabled: false
    weight: 0.8
    categories: it
    
  - name: dockerhub
    engine: docker_hub
    shortcut: dock
    disabled: false
    weight: 0.8
    categories: it

  # ===== LINUX & DOCS =====
  - name: archwiki
    engine: archwiki
    shortcut: aw
    disabled: false
    weight: 1.1
    categories: it

  # ===== NEWS & SOCIAL =====
  - name: google news
    engine: google_news
    shortcut: gn
    disabled: false
    weight: 1.0
    categories: news
    
  - name: reddit
    engine: reddit
    shortcut: r
    disabled: false
    weight: 1.1
    categories: social

  # ===== SCIENCE =====
  - name: google scholar
    engine: google_scholar
    shortcut: gs
    disabled: false
    weight: 1.3
    categories: science
    
  - name: arxiv
    engine: arxiv
    shortcut: ax
    disabled: false
    weight: 1.0
    categories: science

  # ===== DISABLED =====
  - name: yahoo
    disabled: true
