<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#14110f"/>

  <!-- Top Bar -->
  <rect x="40" y="26" width="1520" height="60" fill="#211b18" stroke="#8a6a3f" stroke-width="2" rx="14"/>
  <text x="80" y="65" fill="#e8dcc6" font-size="32">GAME ROOM — KADER DÜĞÜMLERİ</text>

  <!-- Map -->
  <rect x="60" y="110" width="960" height="600" fill="#2d2521" stroke="#9d7847" stroke-width="3" rx="18"/>
  <text x="100" y="150" fill="#b8aa93">MAIN MAP</text>

  <!-- Player Panel -->
  <rect x="1040" y="110" width="480" height="600" fill="#211b18" stroke="#8a6a3f" stroke-width="2" rx="14"/>

  <!-- Players -->
  <rect x="1060" y="180" width="440" height="80" fill="#2b231f" rx="10"/>
  <text x="1100" y="225" fill="#e8dcc6">YOU - READY</text>

  <rect x="1060" y="280" width="440" height="80" fill="#2b231f" rx="10"/>
  <text x="1100" y="325" fill="#e8dcc6">AI1 - READY</text>

  <rect x="1060" y="380" width="440" height="80" fill="#2b231f" rx="10"/>
  <text x="1100" y="425" fill="#e8dcc6">AI2 - READY</text>

  <rect x="1060" y="480" width="440" height="80" fill="#2b231f" rx="10"/>
  <text x="1100" y="525" fill="#e8dcc6">US1 - WAITING</text>

  <!-- Start Button -->
  <rect x="1240" y="640" width="260" height="60" fill="#3a2d22" stroke="#c69953" rx="12"/>
  <text x="1300" y="680" fill="#e8dcc6">START</text>
</svg>
