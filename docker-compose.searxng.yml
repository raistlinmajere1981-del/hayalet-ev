version: '3.8'

# Hayalet-ev SearXNG Web Search Engine
# Başlatmak için: docker compose -f docker-compose.searxng.yml up -d

services:
  searxng:
    image: searxng/searxng:latest
    container_name: hayalet-searxng
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/searxng_settings.yml:/etc/searxng/settings.yml:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888
      - SEARXNG_SECRET_KEY=hayalet-ev-secret-key-change-me
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: hayalet-searxng-redis
    restart: unless-stopped
    network_mode: host
    command: redis-server --port 6380 --save 30 1 --loglevel warning
    volumes:
      - searxng-redis:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE

volumes:
  searxng-redis:
