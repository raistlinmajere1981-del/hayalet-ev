<section class="page page-analyze is-hidden" id="page-analyze" aria-labelledby="page-analyze-title">
  <h2
    class="visually-hidden"
    id="page-analyze-title"
    data-shell-i18n-text="sideNav.analyzeLabel"
  ></h2>
  <div class="analyze-wrapper">
    <div class="conversation-grid">
      <div class="conv-card glass-panel ds-surface-card ds-surface-card--stack" id="card-ai1">
        <div class="conv-header ds-surface-card__header">
          <div class="identity">
            <div class="avatar-circle" id="avatar-ai1">N</div>
            <div>
              <div class="name" id="name-ai1">AI1</div>
              <div
                class="identity-status"
                id="status-ai1"
                data-shell-i18n-text="app.analyze.page.connectedStatus"
              ></div>
            </div>
          </div>
        </div>

        <div
          class="conv-body"
          id="messages-ai1"
          role="log"
          aria-live="polite"
          aria-relevant="additions text"
        >
          <div class="message-placeholder" data-shell-i18n-text="app.analyze.page.noMessages"></div>
        </div>
      </div>

      <div class="conv-card glass-panel ds-surface-card ds-surface-card--stack" id="card-ai2">
        <div class="conv-header ds-surface-card__header">
          <div class="identity">
            <div class="avatar-circle" id="avatar-ai2">G</div>
            <div>
              <div class="name" id="name-ai2">AI2</div>
              <div
                class="identity-status"
                id="status-ai2"
                data-shell-i18n-text="app.analyze.page.connectedStatus"
              ></div>
            </div>
          </div>
        </div>
        <div
          class="conv-body"
          id="messages-ai2"
          role="log"
          aria-live="polite"
          aria-relevant="additions text"
        >
          <div class="message-placeholder" data-shell-i18n-text="app.analyze.page.noMessages"></div>
        </div>
      </div>

      <div
        class="conv-card glass-panel ds-surface-card ds-surface-card--stack is-hidden"
        id="card-us1"
      >
        <div class="conv-header ds-surface-card__header">
          <div class="identity">
            <div class="avatar-circle" id="avatar-us1">US</div>
            <div>
              <div class="name" id="name-us1">US1</div>
              <div
                class="identity-status"
                id="status-us1"
                data-shell-i18n-text="app.analyze.page.disconnectedStatus"
              ></div>
            </div>
          </div>
        </div>
        <div
          class="conv-body"
          id="messages-us1"
          role="log"
          aria-live="polite"
          aria-relevant="additions text"
        >
          <div class="message-placeholder" data-shell-i18n-text="app.analyze.page.noMessages"></div>
        </div>
      </div>
    </div>

    <div class="compose-row">
      <div class="compose-area">
        <div class="compose-input-row">
          <div class="identity compose-user-identity">
            <div class="avatar-circle" id="avatar-user-compose">U</div>
            <div class="compose-user-meta">
              <div
                class="name"
                id="name-user-compose"
                data-shell-i18n-text="app.analyze.page.userLabel"
              ></div>
            </div>
          </div>

          <textarea
            class="form-input large"
            id="compose-input"
            aria-label=""
            placeholder=""
            data-shell-i18n-aria-label="app.analyze.page.composePlaceholder"
            data-shell-i18n-placeholder="app.analyze.page.composePlaceholder"
            spellcheck="false"
          ></textarea>
        </div>

        <div class="compose-actions">
          <button
            class="btn btn-primary btn-sm compose-start-action"
            id="compose-start-btn"
            data-shell-i18n-text="app.analyze.page.startChatButton"
          ></button>
          <button
            class="btn btn-danger btn-sm compose-start-action"
            id="compose-stop-btn"
            data-shell-i18n-text="app.analyze.page.stopChatButton"
          ></button>
          <div class="send-controls">
            <label class="ds-choice-chip ds-choice-chip--segmented"
              ><input type="checkbox" id="send-ai1" checked />
              <span id="send-ai1-label">AI1</span></label
            >
            <label class="ds-choice-chip ds-choice-chip--segmented">
              <input type="checkbox" id="send-ai2" checked />
              <span id="send-ai2-label">AI2</span></label
            >
            <label class="ds-choice-chip ds-choice-chip--segmented">
              <input type="checkbox" id="send-us1" />
              <span id="send-us1-label">US1</span>
            </label>
            <label class="ds-choice-chip ds-choice-chip--segmented">
              <input type="checkbox" id="send-cross" />
              <span data-shell-i18n-text="app.analyze.page.crossLabel"></span>
            </label>
          </div>
          <button class="btn btn-primary btn-sm" id="compose-send-btn">
            <span class="btn-text" data-shell-i18n-text="app.analyze.page.sendButton"></span>
          </button>
          <button
            class="btn btn-secondary btn-sm"
            id="upload-add-btn"
            data-shell-i18n-text="app.analyze.page.addFileButton"
          ></button>
          <button
            type="button"
            class="btn btn-secondary btn-sm analyze-archive-trigger"
            id="analyze-archive-open-btn"
          >
            <span
              class="analyze-archive-trigger__eyebrow"
              data-shell-i18n-text="app.analyze.page.archiveOverlayEyebrow"
            ></span>
            <span
              class="analyze-archive-trigger__title"
              data-shell-i18n-text="app.analyze.page.archiveOverlayButton"
            ></span>
          </button>
        </div>
      </div>

      <div class="compose-files glass-panel ds-surface-card">
        <div
          class="file-box"
          id="upload-list"
          data-shell-i18n-text="app.analyze.page.noFiles"
        ></div>
      </div>
    </div>
  </div>

  <div class="analyze-archive-overlay is-hidden" id="analyze-archive-overlay" aria-hidden="true">
    <div class="analyze-archive-overlay__backdrop" id="analyze-archive-backdrop"></div>
    <div
      class="analyze-archive-overlay__panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="analyze-archive-overlay-title"
    >
      <div class="analyze-archive-overlay__header">
        <div class="analyze-archive-overlay__heading">
          <p
            class="analyze-archive-overlay__eyebrow"
            data-shell-i18n-text="app.analyze.page.archiveOverlayEyebrow"
          ></p>
          <h3
            class="analyze-archive-overlay__title"
            id="analyze-archive-overlay-title"
            data-shell-i18n-text="app.analyze.page.archiveOverlayTitle"
          ></h3>
          <p
            class="analyze-archive-overlay__subtitle"
            data-shell-i18n-text="app.analyze.page.archiveOverlaySubtitle"
          ></p>
        </div>
        <button
          type="button"
          class="btn btn-ghost btn-sm"
          id="analyze-archive-close-btn"
          data-shell-i18n-text="common.close"
        ></button>
      </div>

      <div class="analyze-archive-overlay__body">
        <div class="archives-wrapper">
          <div class="archives-top">
            <div class="archives-sidebar ds-surface-card ds-surface-card--stack">
              <div class="sidebar-header ds-surface-card__header">
                <h3
                  id="archives-sidebar-title"
                  data-shell-i18n-text="app.archives.page.sidebarTitle"
                ></h3>
                <div class="provider-toggle">
                  <label class="ds-choice-chip ds-choice-chip--segmented">
                    <input
                      type="radio"
                      name="archives-provider"
                      value="ai1"
                      id="archive-filter-ai1"
                      checked
                    />
                    <span id="archives-provider-ai1">AI1</span>
                  </label>
                  <label class="ds-choice-chip ds-choice-chip--segmented">
                    <input
                      type="radio"
                      name="archives-provider"
                      value="ai2"
                      id="archive-filter-ai2"
                    />
                    <span id="archives-provider-ai2">AI2</span>
                  </label>
                  <label class="ds-choice-chip ds-choice-chip--segmented">
                    <input
                      type="radio"
                      name="archives-provider"
                      value="us1"
                      id="archive-filter-us1"
                    />
                    <span id="archives-provider-us1">US1</span>
                  </label>
                </div>
              </div>
              <div class="archives-list" id="archives-list">
                <div class="empty" data-shell-i18n-text="app.archives.page.empty"></div>
              </div>
            </div>

            <div class="archives-detail ds-surface-card ds-surface-card--stack">
              <div class="detail-header ds-surface-card__header">
                <h3
                  id="archives-detail-title"
                  data-shell-i18n-text="app.archives.page.detailTitle"
                ></h3>
              </div>

              <div class="detail-content" id="detail-content">
                <div class="ds-empty-state" id="detail-empty">
                  <p
                    id="archives-detail-empty-text"
                    data-shell-i18n-text="app.archives.page.detailEmpty"
                  ></p>
                </div>

                <form class="conversation-form is-hidden" id="conversation-form">
                  <div class="form-group">
                    <label
                      for="archive-title"
                      id="archives-title-label"
                      data-shell-i18n-text="app.archives.page.titleLabel"
                    ></label>
                    <input
                      type="text"
                      id="archive-title"
                      class="form-input"
                      placeholder=""
                      data-shell-i18n-placeholder="app.archives.page.titlePlaceholder"
                    />
                  </div>

                  <div class="form-group">
                    <label
                      for="archive-summary"
                      id="archives-summary-label"
                      data-shell-i18n-text="app.archives.page.summaryLabel"
                    ></label>
                    <textarea
                      id="archive-summary"
                      class="form-input"
                      rows="3"
                      placeholder=""
                      data-shell-i18n-placeholder="app.archives.page.summaryPlaceholder"
                    ></textarea>
                  </div>

                  <div class="form-group">
                    <label
                      id="archives-weburl-label"
                      data-shell-i18n-text="app.archives.page.webUrlLabel"
                    ></label>
                    <div class="url-display-group">
                      <span class="url-display" id="archive-weburl-display">-</span>
                      <button
                        type="button"
                        class="icon-btn"
                        id="btn-copy-url"
                        title=""
                        aria-label=""
                        data-shell-i18n-title="app.archives.page.copyUrlTitle"
                        data-shell-i18n-aria-label="app.archives.page.copyUrlTitle"
                      >
                        📋
                      </button>
                    </div>
                  </div>

                  <div class="form-actions">
                    <button
                      type="submit"
                      class="btn btn-primary"
                      id="archive-save"
                      data-shell-i18n-text="app.archives.page.saveButton"
                    ></button>
                    <button
                      type="button"
                      class="btn btn-danger"
                      id="btn-delete"
                      data-shell-i18n-text="app.archives.page.deleteButton"
                    ></button>
                  </div>
                  <div class="form-hint" id="archive-status" role="status" aria-live="polite"></div>
                </form>
              </div>
            </div>

            <div class="archives-search ds-surface-card ds-surface-card--stack">
              <div class="search-header ds-surface-card__header">
                <h3
                  id="archives-search-title"
                  data-shell-i18n-text="app.archives.page.searchTitle"
                ></h3>
                <div class="search-scope">
                  <label class="ds-choice-chip ds-choice-chip--segmented">
                    <input type="radio" name="search-scope" value="current" checked />
                    <span
                      id="archives-scope-current"
                      data-shell-i18n-text="app.archives.page.scopeCurrent"
                    ></span>
                  </label>
                  <label class="ds-choice-chip ds-choice-chip--segmented">
                    <input type="radio" name="search-scope" value="all" />
                    <span
                      id="archives-scope-all"
                      data-shell-i18n-text="app.archives.page.scopeAll"
                    ></span>
                  </label>
                </div>
              </div>

              <div class="search-input-wrapper">
                <input
                  type="text"
                  id="search-input"
                  class="form-input"
                  aria-label=""
                  placeholder=""
                  data-shell-i18n-aria-label="app.archives.page.searchPlaceholder"
                  data-shell-i18n-placeholder="app.archives.page.searchPlaceholder"
                  autocomplete="off"
                />
                <button type="button" class="btn-clear is-hidden" id="btn-clear-search">×</button>
              </div>

              <div class="search-tabs">
                <button class="tab-btn is-active" data-tab="messages">
                  <span
                    id="archives-messages-tab-label"
                    data-shell-i18n-text="app.archives.page.messagesTab"
                  ></span>
                  <span class="tab-count" id="messages-count">0</span>
                </button>
                <button class="tab-btn" data-tab="files">
                  <span
                    id="archives-files-tab-label"
                    data-shell-i18n-text="app.archives.page.filesTab"
                  ></span>
                  <span class="tab-count" id="files-count">0</span>
                </button>
              </div>

              <div class="search-results" id="search-results">
                <div class="search-empty" id="search-empty">
                  <p
                    id="archives-search-empty-text"
                    data-shell-i18n-text="app.archives.page.searchEmpty"
                  ></p>
                </div>

                <div class="results-panel is-active" id="results-messages"></div>
                <div class="results-panel" id="results-files"></div>
              </div>
            </div>
          </div>

          <div class="archives-bottom">
            <div class="protocol-sidebar ds-surface-card ds-surface-card--stack">
              <div class="protocol-header ds-surface-card__header">
                <h3
                  id="archives-protocol-list-title"
                  data-shell-i18n-text="app.archives.page.protocolListTitle"
                ></h3>
              </div>
              <div class="protocol-list" id="protocol-list">
                <div
                  class="empty"
                  id="archives-protocol-list-loading"
                  data-shell-i18n-text="app.archives.page.protocolLoading"
                ></div>
              </div>
            </div>

            <div class="protocol-editor ds-surface-card ds-surface-card--stack">
              <div class="protocol-editor-header ds-surface-card__header">
                <h3
                  id="protocol-editor-title"
                  data-shell-i18n-text="app.archives.page.protocolEditorPlaceholderTitle"
                ></h3>
                <div class="protocol-tag-buttons is-hidden" id="protocol-tag-buttons">
                  <button
                    type="button"
                    class="btn btn-ghost btn-xs protocol-tag-btn"
                    data-tag="<AI0>"
                  >
                    &lt;AI0&gt;
                  </button>
                  <button
                    type="button"
                    class="btn btn-ghost btn-xs protocol-tag-btn"
                    data-tag="<AI1>"
                  >
                    &lt;AI1&gt;
                  </button>
                  <button
                    type="button"
                    class="btn btn-ghost btn-xs protocol-tag-btn"
                    data-tag="<AI2>"
                  >
                    &lt;AI2&gt;
                  </button>
                </div>
                <button
                  class="btn btn-primary btn-sm is-hidden"
                  id="btn-protocol-save"
                  data-shell-i18n-text="app.archives.page.protocolSaveButton"
                ></button>
              </div>
              <div class="protocol-editor-content">
                <div class="ds-empty-state" id="protocol-empty">
                  <p
                    id="archives-protocol-empty-text"
                    data-shell-i18n-text="app.archives.page.protocolEmpty"
                  ></p>
                </div>
                <textarea
                  class="protocol-textarea form-input is-hidden"
                  id="protocol-textarea"
                  placeholder=""
                  data-shell-i18n-placeholder="app.archives.page.protocolPlaceholder"
                ></textarea>
              </div>
              <div class="form-hint" id="protocol-status" role="status" aria-live="polite"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal modal-document modal-read is-hidden" id="read-modal">
    <div class="modal-content">
      <div class="modal-header">
        <button
          class="btn btn-ghost"
          id="read-modal-close"
          data-shell-i18n-text="common.close"
        ></button>
      </div>
      <div class="modal-body" id="read-modal-body"></div>
    </div>
  </div>
</section>
