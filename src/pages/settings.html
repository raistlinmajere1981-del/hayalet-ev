<!doctype html>
<html lang="und" data-theme="obsidian">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <section
        class="page page-settings settings-page"
        id="page-settings"
        aria-labelledby="page-settings-title"
      >
        <h2
          class="visually-hidden"
          id="page-settings-title"
          data-shell-i18n-text="settingsHub.openButton"
        ></h2>
        <div
          class="settings-hub-shell settings-page__shell"
          aria-label=""
          data-shell-i18n-aria-label="settingsHub.ariaLabel"
        >
          <div
            class="settings-scene"
            id="settings-scene-root"
            aria-label=""
            data-shell-i18n-aria-label="settingsHub.scene.ariaLabel"
            aria-hidden="true"
            hidden
          >
            <div class="settings-scene__surface scene-shell__surface">
              <img
                class="settings-scene__background scene-shell__cover-image"
                id="settings-scene-background"
                alt=""
              />

              <div
                class="settings-scene__room-view scene-shell__room-layer"
                id="settings-scene-room-view"
                aria-hidden="false"
              >
                <div class="settings-scene__hotspots" id="settings-scene-hotspots"></div>
                <div
                  class="settings-scene__characters entrance-scene__characters"
                  id="settings-scene-characters"
                ></div>
                <div class="entrance-scene__editor-host" id="settings-scene-editor-host"></div>
              </div>

              <div
                class="settings-scene__panel-view scene-shell__view"
                id="settings-scene-panel-view"
                aria-hidden="true"
              >
                <img
                  class="settings-scene__panel-art scene-shell__cover-image"
                  id="settings-scene-panel-art"
                  alt=""
                />
                <div class="settings-scene__panel-shade"></div>
                <div class="settings-scene__panel-slot" id="settings-scene-panel-slot"></div>
              </div>
            </div>
          </div>
          <div class="settings-hub-layout">
            <aside class="settings-hub-nav">
              <div
                class="settings-hub-tabs"
                role="tablist"
                aria-label=""
                data-shell-i18n-aria-label="settingsHub.ariaLabel"
              >
                <button
                  class="settings-hub-tab is-active"
                  id="settings-tab-theme"
                  type="button"
                  role="tab"
                  aria-selected="true"
                  aria-controls="settings-panel-theme"
                  data-settings-panel="theme"
                >
                  <span class="settings-hub-tab__index">01</span>
                  <span
                    class="settings-hub-tab__label"
                    data-shell-i18n-text="settingsHub.nav.theme"
                  ></span>
                </button>
                <button
                  class="settings-hub-tab"
                  id="settings-tab-accounts"
                  type="button"
                  role="tab"
                  aria-selected="false"
                  aria-controls="settings-panel-accounts"
                  data-settings-panel="accounts"
                >
                  <span class="settings-hub-tab__index">02</span>
                  <span
                    class="settings-hub-tab__label"
                    data-shell-i18n-text="settingsHub.nav.accounts"
                  ></span>
                </button>
                <button
                  class="settings-hub-tab"
                  id="settings-tab-backup"
                  type="button"
                  role="tab"
                  aria-selected="false"
                  aria-controls="backup-overlay"
                  data-settings-panel="backup"
                >
                  <span class="settings-hub-tab__index">03</span>
                  <span
                    class="settings-hub-tab__label"
                    data-shell-i18n-text="settingsHub.nav.backup"
                  ></span>
                </button>
                <button
                  class="settings-hub-tab"
                  id="settings-tab-rooms"
                  type="button"
                  role="tab"
                  aria-selected="false"
                  aria-controls="rooms-overlay"
                  data-settings-panel="rooms"
                >
                  <span class="settings-hub-tab__index">04</span>
                  <span
                    class="settings-hub-tab__label"
                    data-shell-i18n-text="settingsHub.nav.rooms"
                  ></span>
                </button>
                <button
                  class="settings-hub-tab"
                  id="settings-tab-live-log"
                  type="button"
                  role="tab"
                  aria-selected="false"
                  aria-controls="live-log-overlay"
                  data-settings-panel="live-log"
                >
                  <span class="settings-hub-tab__index">05</span>
                  <span
                    class="settings-hub-tab__label"
                    data-shell-i18n-text="settingsHub.nav.liveLog"
                  ></span>
                </button>
              </div>
              <button
                class="btn btn-ghost btn-sm settings-hub-close"
                id="settings-hub-close"
                data-shell-i18n-text="common.close"
              ></button>
            </aside>

            <div class="settings-hub-panels">
              <section
                class="settings-hub-panel is-active"
                id="settings-panel-theme"
                role="tabpanel"
                aria-labelledby="settings-tab-theme"
                data-settings-panel="theme"
              >
                <div class="settings-panel-shell settings-panel-shell--theme">
                  <div class="settings-panel-head">
                    <div class="settings-panel-copy">
                      <span
                        class="settings-panel-kicker"
                        data-shell-i18n-text="settingsHub.nav.theme"
                      ></span>
                      <h3
                        class="settings-panel-title"
                        data-shell-i18n-text="theme.selectTitle"
                      ></h3>
                    </div>
                    <div class="settings-theme-current">
                      <span
                        class="theme-dropdown-icon settings-theme-current__icon"
                        id="theme-current-icon"
                        >🌑</span
                      >
                      <div class="settings-theme-current__copy">
                        <span
                          class="settings-theme-current__label"
                          data-shell-i18n-text="settingsHub.currentThemeLabel"
                        ></span>
                        <strong id="theme-current-name"></strong>
                        <small id="theme-current-meta"></small>
                      </div>
                    </div>
                  </div>
                  <div class="settings-panel-scroll settings-panel-scroll--theme">
                    <section
                      class="glass-panel ds-surface-card ds-surface-card--stack settings-appearance-card settings-appearance-card--gallery"
                    >
                      <div class="ds-surface-card__body settings-appearance-card__body">
                        <div class="settings-theme-grid" id="theme-settings-list"></div>
                      </div>
                    </section>

                    <div class="settings-theme-layout">
                      <section
                        class="glass-panel ds-surface-card ds-surface-card--stack settings-appearance-card"
                      >
                        <div class="ds-surface-card__header settings-theme-card-head">
                          <div>
                            <h4
                              class="settings-theme-section-title"
                              data-shell-i18n-text="theme.behaviorTitle"
                            ></h4>
                            <p class="settings-theme-section-hint" id="theme-mode-hint"></p>
                          </div>
                          <span class="settings-theme-mode-badge" id="theme-mode-badge"></span>
                        </div>
                        <div class="ds-surface-card__body settings-appearance-card__body">
                          <div class="settings-theme-form-grid">
                            <div class="settings-theme-field settings-theme-field--wide">
                              <label
                                class="form-label"
                                for="theme-behavior-select"
                                data-shell-i18n-text="theme.mode.label"
                              ></label>
                              <select id="theme-behavior-select" class="select select-sm">
                                <option
                                  value="manual"
                                  data-shell-i18n-text="theme.mode.options.manual"
                                ></option>
                                <option
                                  value="system"
                                  data-shell-i18n-text="theme.mode.options.system"
                                ></option>
                                <option
                                  value="schedule"
                                  data-shell-i18n-text="theme.mode.options.schedule"
                                ></option>
                              </select>
                            </div>
                            <div class="settings-theme-field">
                              <label
                                class="form-label"
                                for="theme-light-select"
                                data-shell-i18n-text="theme.lightThemeLabel"
                              ></label>
                              <select id="theme-light-select" class="select select-sm"></select>
                            </div>
                            <div class="settings-theme-field">
                              <label
                                class="form-label"
                                for="theme-dark-select"
                                data-shell-i18n-text="theme.darkThemeLabel"
                              ></label>
                              <select id="theme-dark-select" class="select select-sm"></select>
                            </div>
                            <div class="settings-theme-field" data-theme-schedule-field hidden>
                              <label
                                class="form-label"
                                for="theme-day-start"
                                data-shell-i18n-text="theme.dayStartLabel"
                              ></label>
                              <input
                                id="theme-day-start"
                                class="input input-sm"
                                type="time"
                                value="07:00"
                              />
                            </div>
                            <div class="settings-theme-field" data-theme-schedule-field hidden>
                              <label
                                class="form-label"
                                for="theme-night-start"
                                data-shell-i18n-text="theme.nightStartLabel"
                              ></label>
                              <input
                                id="theme-night-start"
                                class="input input-sm"
                                type="time"
                                value="19:00"
                              />
                            </div>
                          </div>
                        </div>
                      </section>

                      <section
                        class="glass-panel ds-surface-card ds-surface-card--stack settings-appearance-card"
                      >
                        <div class="ds-surface-card__header settings-theme-card-head">
                          <div>
                            <h4
                              class="settings-theme-section-title"
                              data-shell-i18n-text="theme.tuningTitle"
                            ></h4>
                            <p
                              class="settings-theme-section-hint"
                              data-shell-i18n-text="theme.tuningHint"
                            ></p>
                          </div>
                        </div>
                        <div class="ds-surface-card__body settings-appearance-card__body">
                          <div class="settings-theme-form-grid">
                            <div class="settings-theme-field">
                              <label
                                class="form-label"
                                for="theme-motion-select"
                                data-shell-i18n-text="theme.motionLabel"
                              ></label>
                              <select id="theme-motion-select" class="select select-sm">
                                <option
                                  value="full"
                                  data-shell-i18n-text="theme.motion.options.full"
                                ></option>
                                <option
                                  value="reduced"
                                  data-shell-i18n-text="theme.motion.options.reduced"
                                ></option>
                                <option
                                  value="off"
                                  data-shell-i18n-text="theme.motion.options.off"
                                ></option>
                              </select>
                            </div>
                            <div class="settings-theme-field">
                              <label
                                class="form-label"
                                for="theme-text-scale-select"
                                data-shell-i18n-text="theme.textScaleLabel"
                              ></label>
                              <select id="theme-text-scale-select" class="select select-sm">
                                <option
                                  value="sm"
                                  data-shell-i18n-text="theme.textScale.options.sm"
                                ></option>
                                <option
                                  value="md"
                                  data-shell-i18n-text="theme.textScale.options.md"
                                ></option>
                                <option
                                  value="lg"
                                  data-shell-i18n-text="theme.textScale.options.lg"
                                ></option>
                              </select>
                            </div>
                            <div class="settings-theme-field settings-theme-field--wide">
                              <label
                                class="form-label"
                                for="theme-surface-select"
                                data-shell-i18n-text="theme.surfaceLabel"
                              ></label>
                              <select id="theme-surface-select" class="select select-sm">
                                <option
                                  value="glass"
                                  data-shell-i18n-text="theme.surface.options.glass"
                                ></option>
                                <option
                                  value="soft"
                                  data-shell-i18n-text="theme.surface.options.soft"
                                ></option>
                                <option
                                  value="solid"
                                  data-shell-i18n-text="theme.surface.options.solid"
                                ></option>
                              </select>
                            </div>
                            <div class="settings-theme-toggle-row settings-theme-field--wide">
                              <div class="settings-theme-toggle-copy">
                                <span
                                  class="form-label"
                                  data-shell-i18n-text="theme.contrastLabel"
                                ></span>
                                <p
                                  class="settings-theme-section-hint"
                                  data-shell-i18n-text="theme.contrastHint"
                                ></p>
                              </div>
                              <label class="ds-mcp-switch">
                                <input
                                  id="theme-contrast-toggle"
                                  type="checkbox"
                                  class="ds-mcp-switch__input"
                                />
                                <span class="ds-mcp-switch__slider"></span>
                              </label>
                            </div>
                          </div>
                        </div>
                      </section>
                    </div>

                    <section
                      class="glass-panel ds-surface-card ds-surface-card--stack settings-appearance-card"
                    >
                      <div class="ds-surface-card__header settings-theme-card-head">
                        <div>
                          <h4
                            class="settings-theme-section-title"
                            data-shell-i18n-text="theme.scene.title"
                          ></h4>
                          <p
                            class="settings-theme-section-hint"
                            data-shell-i18n-text="theme.scene.hint"
                          ></p>
                        </div>
                        <span class="settings-theme-mode-badge" id="scene-theme-source-badge"></span>
                      </div>
                      <div class="ds-surface-card__body settings-appearance-card__body">
                        <div class="settings-theme-current">
                          <span class="settings-theme-current__icon" aria-hidden="true">🎭</span>
                          <div class="settings-theme-current__copy">
                            <span
                              class="settings-theme-current__label"
                              data-shell-i18n-text="theme.scene.activeLabel"
                            ></span>
                            <strong id="scene-theme-current-name"></strong>
                            <small id="scene-theme-current-meta"></small>
                          </div>
                        </div>

                        <div class="settings-theme-form-grid">
                          <div class="settings-theme-field">
                            <label
                              class="form-label"
                              for="scene-theme-conflict-select"
                              data-shell-i18n-text="theme.scene.importBehaviorLabel"
                            ></label>
                            <select id="scene-theme-conflict-select" class="select select-sm">
                              <option
                                value="rename"
                                data-shell-i18n-text="theme.scene.importBehavior.options.rename"
                              ></option>
                              <option
                                value="reject"
                                data-shell-i18n-text="theme.scene.importBehavior.options.reject"
                              ></option>
                              <option
                                value="replace"
                                data-shell-i18n-text="theme.scene.importBehavior.options.replace"
                              ></option>
                            </select>
                          </div>
                          <div class="settings-theme-field settings-theme-field--wide">
                            <div class="settings-scene-theme-actions">
                              <button
                                class="btn btn-secondary btn-sm"
                                id="scene-theme-import"
                                data-shell-i18n-text="theme.scene.actions.import"
                              ></button>
                              <button
                                class="btn btn-ghost btn-sm"
                                id="scene-theme-refresh"
                                data-shell-i18n-text="theme.scene.actions.refresh"
                              ></button>
                              <button
                                class="btn btn-ghost btn-sm"
                                id="scene-theme-export"
                                data-shell-i18n-text="theme.scene.actions.export"
                              ></button>
                            </div>
                          </div>
                        </div>

                        <div class="settings-theme-toggle-row settings-theme-field--wide">
                          <div class="settings-theme-toggle-copy">
                            <span
                              class="form-label"
                              data-shell-i18n-text="theme.scene.selectedLabel"
                            ></span>
                            <p class="settings-theme-section-hint" id="scene-theme-selection-hint"></p>
                          </div>
                          <button
                            class="btn btn-primary btn-sm"
                            id="scene-theme-apply"
                            data-shell-i18n-text="theme.scene.actions.apply"
                          ></button>
                        </div>

                        <div class="settings-theme-grid" id="scene-theme-settings-list"></div>
                      </div>
                    </section>
                  </div>
                </div>
              </section>

              <section
                class="settings-hub-panel is-hidden"
                id="settings-panel-accounts"
                role="tabpanel"
                aria-labelledby="settings-tab-accounts"
                data-settings-panel="accounts"
                aria-hidden="true"
                hidden
              >
                <div class="settings-panel-shell settings-panel-shell--accounts">
                  <div class="settings-panel-head settings-panel-head--workbench">
                    <div class="settings-panel-copy">
                      <span
                        class="settings-panel-kicker"
                        data-shell-i18n-text="settingsHub.nav.accounts"
                      ></span>
                      <h3
                        class="settings-panel-title"
                        data-shell-i18n-text="settingsHub.accounts.title"
                      ></h3>
                    </div>
                  </div>

                  <div class="settings-panel-scroll settings-panel-scroll--accounts">
                    <div class="settings-accounts-grid">
                      <section class="settings-accounts-column">
                        <div
                          class="entrance-panel glass-panel ds-surface-card ds-surface-card--stack"
                          data-panel="user"
                        >
                          <div class="entrance-panel__header ds-surface-card__header">
                            <span
                              class="entrance-panel__title ds-panel-title"
                              data-i18n-text="panels.user"
                            ></span>
                          </div>
                          <div class="entrance-panel__content">
                            <div class="user-settings-column">
                              <div class="user-avatar-row user-profile-inline">
                                <div
                                  class="user-avatar-wrapper"
                                  id="user-avatar-edit-btn"
                                  title=""
                                  role="button"
                                  tabindex="0"
                                  aria-label=""
                                  data-i18n-title="user.changeAvatarTitle"
                                  data-i18n-aria-label="user.changeAvatarTitle"
                                >
                                  <div class="avatar-placeholder img-cover" id="user-avatar"></div>
                                  <div class="user-edit-overlay">📷</div>
                                </div>
                                <div
                                  class="user-profile-inline__field user-profile-inline__field--nickname"
                                >
                                  <input
                                    type="text"
                                    id="user-nickname-input"
                                    class="input input-sm"
                                    placeholder=""
                                    data-i18n-placeholder="user.nicknamePlaceholder"
                                  />
                                </div>
                                <div
                                  class="user-profile-inline__field user-profile-inline__field--language"
                                >
                                  <label
                                    class="form-label"
                                    id="app-language-label"
                                    for="app-language-select"
                                    data-i18n-text="user.language.label"
                                  ></label>
                                  <select
                                    id="app-language-select"
                                    class="select select-sm"
                                  ></select>
                                </div>
                              </div>
                              <section class="us1-slot-panel__section">
                                <div class="us1-slot-panel__status-block">
                                  <span
                                    class="form-label"
                                    data-i18n-text="us1.mailAccount.verifiedLabel"
                                  ></span>
                                  <div
                                    class="us1-slot-panel__status"
                                    id="us1-mail-verified-email"
                                  ></div>
                                  <div
                                    class="us1-slot-panel__hint"
                                    id="us1-mail-account-status"
                                  ></div>
                                </div>
                                <div class="us1-slot-panel__grid">
                                  <div
                                    class="us1-slot-panel__mail-meta us1-slot-panel__field--wide"
                                  >
                                    <label
                                      class="form-label us1-slot-panel__mail-meta-label us1-slot-panel__mail-meta-label--provider"
                                      for="us1-mail-provider-select"
                                      data-i18n-text="us1.mailAccount.providerLabel"
                                    ></label>
                                    <label
                                      class="form-label us1-slot-panel__mail-meta-label us1-slot-panel__mail-meta-label--helper"
                                      data-us1-mail-gmail-helper
                                      data-i18n-text="us1.mailAccount.gmailHelperTitle"
                                    ></label>
                                    <select
                                      id="us1-mail-provider-select"
                                      class="select select-sm us1-slot-panel__mail-meta-control us1-slot-panel__mail-meta-control--provider"
                                    >
                                      <option
                                        value="gmail"
                                        data-i18n-text="us1.mailAccount.providers.gmail"
                                      ></option>
                                      <option
                                        value="custom-imap-smtp"
                                        data-i18n-text="us1.mailAccount.providers.custom"
                                      ></option>
                                    </select>
                                    <button
                                      class="btn btn-secondary btn-sm us1-slot-panel__gmail-action us1-slot-panel__mail-meta-control us1-slot-panel__mail-meta-control--helper"
                                      id="us1-mail-gmail-open-security"
                                      data-us1-mail-gmail-helper
                                      data-i18n-text="us1.mailAccount.gmailHelperStep1"
                                    ></button>
                                  </div>
                                  <div
                                    class="us1-slot-panel__grid us1-slot-panel__gmail-panel us1-slot-panel__field--wide"
                                    data-us1-mail-gmail-helper
                                  >
                                    <div class="us1-slot-panel__field us1-slot-panel__field--wide">
                                      <label
                                        class="form-label"
                                        data-i18n-text="us1.mailAccount.gmailEmailLabel"
                                      ></label>
                                      <input
                                        id="us1-mail-gmail-email-easy"
                                        class="input input-sm"
                                        type="email"
                                        data-i18n-placeholder="us1.mailAccount.gmailEmailPlaceholder"
                                      />
                                    </div>
                                    <div class="us1-slot-panel__field us1-slot-panel__field--wide">
                                      <label
                                        class="form-label"
                                        data-i18n-text="us1.mailAccount.gmailPasswordLabel"
                                      ></label>
                                      <input
                                        id="us1-mail-gmail-password-easy"
                                        class="input input-sm"
                                        type="password"
                                        data-i18n-placeholder="us1.mailAccount.gmailPasswordPlaceholder"
                                      />
                                    </div>
                                  </div>
                                  <div
                                    class="us1-slot-panel__field us1-slot-panel__field--wide"
                                    data-us1-mail-manual-fields
                                  >
                                    <label
                                      class="form-label"
                                      for="us1-mail-email-input"
                                      data-i18n-text="us1.mailAccount.emailLabel"
                                    ></label>
                                    <input
                                      id="us1-mail-email-input"
                                      class="input input-sm"
                                      type="email"
                                      autocomplete="email"
                                      data-i18n-placeholder="us1.mailAccount.emailPlaceholder"
                                    />
                                  </div>
                                  <div class="us1-slot-panel__field" data-us1-mail-manual-fields>
                                    <label
                                      class="form-label"
                                      for="us1-mail-auth-type-select"
                                      data-i18n-text="us1.mailAccount.authTypeLabel"
                                    ></label>
                                    <select id="us1-mail-auth-type-select" class="select select-sm">
                                      <option
                                        value="password"
                                        data-i18n-text="us1.mailAccount.authTypes.password"
                                      ></option>
                                      <option
                                        value="oauth2"
                                        data-i18n-text="us1.mailAccount.authTypes.oauth2"
                                      ></option>
                                    </select>
                                  </div>
                                  <div class="us1-slot-panel__field" data-us1-mail-password>
                                    <label
                                      class="form-label"
                                      for="us1-mail-password-input"
                                      data-i18n-text="us1.mailAccount.passwordLabel"
                                    ></label>
                                    <input
                                      id="us1-mail-password-input"
                                      class="input input-sm"
                                      type="password"
                                      autocomplete="current-password"
                                      data-i18n-placeholder="us1.mailAccount.passwordPlaceholder"
                                    />
                                  </div>
                                  <div class="us1-slot-panel__field" data-us1-mail-oauth>
                                    <label
                                      class="form-label"
                                      for="us1-mail-access-token-input"
                                      data-i18n-text="us1.mailAccount.accessTokenLabel"
                                    ></label>
                                    <input
                                      id="us1-mail-access-token-input"
                                      class="input input-sm"
                                      type="password"
                                      data-i18n-placeholder="us1.mailAccount.accessTokenPlaceholder"
                                    />
                                  </div>
                                  <div class="us1-slot-panel__field" data-us1-mail-oauth>
                                    <label
                                      class="form-label"
                                      for="us1-mail-refresh-token-input"
                                      data-i18n-text="us1.mailAccount.refreshTokenLabel"
                                    ></label>
                                    <input
                                      id="us1-mail-refresh-token-input"
                                      class="input input-sm"
