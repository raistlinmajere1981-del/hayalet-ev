<div class="page hidden" id="page-settings">
  <div class="settings-container">
    <!-- User Settings -->
    <div class="settings-section">
      <h2>Kullanıcı Ayarları</h2>
      <div class="settings-form">
        <div class="form-group">
          <label for="settings-user-nickname">Takma Ad</label>
          <div style="display:flex; gap:8px; align-items:center;">
            <input
              type="text"
              id="settings-user-nickname"
              class="form-input"
              placeholder="User"
            />
            <button class="btn btn-primary" id="settings-user-nickname-update">
              Güncelle
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="user-avatar">Avatar</label>
          <div class="file-input-group">
            <button class="btn btn-secondary" id="settings-user-avatar-browse">
              Dosya Seç
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="settings-googledrive-clientid">Google Drive OAuth</label>
          <div style="display: flex; gap: 8px; align-items: center">
            <input
              type="text"
              id="settings-googledrive-clientid"
              class="form-input"
              placeholder="Client ID (opsiyonel)"
            />
            <input
              type="text"
              id="settings-googledrive-clientsecret"
              class="form-input"
              placeholder="Client Secret (opsiyonel)"
            />
          </div>
          <div
            style="
              display: flex;
              gap: 8px;
              margin-top: 8px;
              align-items: center;
            "
          >
            <button class="btn btn-secondary" id="settings-googledrive-start">
              Google drive OAuth
            </button>
            <input
              type="text"
              id="settings-googledrive-authcode"
              class="form-input"
              placeholder="Yetkilendirme kodu"
            />
            <button class="btn btn-primary" id="settings-googledrive-toggle">
              Bağlan
            </button>
          </div>
          <div
            class="form-hint"
            id="settings-googledrive-status"
            style="margin-top: 8px"
          ></div>
        </div>
      </div>
    </div>

    <!-- AI1 Settings -->
    <div class="settings-section">
      <h2>Birinci AI Ayarları</h2>
      <div class="settings-form">
        <div class="form-group">
          <label for="settings-ai1-account">Hesap Seçimi</label>
          <select id="settings-ai1-account" class="form-select">
            <option value="">-- Hesap Seç --</option>
            <!-- Accounts will be loaded dynamically -->
          </select>
        </div>
        <div class="form-group">
          <label for="settings-ai1-message-method">Mesaj Ekleme Metodu</label>
          <select id="settings-ai1-message-method" class="form-select">
            <option value="injection">JavaScript Injection</option>
            <option value="xdotools">Xdotools-Xclip</option>
          </select>
        </div>
        <div class="form-group">
          <label for="settings-ai1-file-method">Dosya Ekleme Metodu</label>
          <select id="settings-ai1-file-method" class="form-select">
            <option value="dragdrop">Drag&Drop</option>
            <option value="injection">JavaScript Injection</option>
            <option value="xdotools">Xdotools-Xclip</option>
            <option value="uguu">Uguu</option>
            <option value="tmpfile">Tmpfile</option>
            <option value="catbox">Catbox</option>
            <option value="googledrive">Google Drive</option>
          </select>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="settings-ai1-catch" checked>
            Catch Commands
          </label>
        </div>
      </div>
    </div>

    <!-- AI2 Settings -->
    <div class="settings-section">
      <h2>İkinci AI Ayarları</h2>
      <div class="settings-form">
        <div class="form-group">
          <label for="settings-ai2-account">Hesap Seçimi</label>
          <select id="settings-ai2-account" class="form-select">
            <option value="">-- Hesap Seç --</option>
            <!-- Accounts will be loaded dynamically -->
          </select>
        </div>
        <div class="form-group">
          <label for="settings-ai2-message-method">Mesaj Ekleme Metodu</label>
          <select id="settings-ai2-message-method" class="form-select">
            <option value="injection">JavaScript Injection</option>
            <option value="xdotools">Xdotools-Xclip</option>
          </select>
        </div>
        <div class="form-group">
          <label for="settings-ai2-file-method">Dosya Ekleme Metodu</label>
          <select id="settings-ai2-file-method" class="form-select">
            <option value="dragdrop">Drag&Drop</option>
            <option value="injection">JavaScript Injection</option>
            <option value="xdotools">Xdotools-Xclip</option>
            <option value="uguu">Uguu</option>
            <option value="tmpfile">Tmpfile</option>
            <option value="catbox">Catbox</option>
            <option value="googledrive">Google Drive</option>
          </select>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="settings-ai2-catch" checked>
            Catch Commands
          </label>
        </div>
      </div>
    </div>

    <!-- Account Management Section -->
    <div class="settings-section">
      <h2>Hesap Yönetimi</h2>
      <div class="settings-form">
        <!-- Account List -->
        <div class="form-group">
          <label>Kayıtlı Hesaplar</label>
          <div id="account-list" class="account-list">
            <div class="empty-message">Henüz hesap yok</div>
          </div>
        </div>

        <!-- Create Account Form -->
        <div class="form-group">
          <label>Yeni Hesap Ekle</label>
          <div class="account-create-form">
            <input
              type="text"
              id="new-account-email"
              class="form-input"
              placeholder="Email adresi"
            />
            <select id="new-account-provider" class="form-select">
              <option value="chatgpt">ChatGPT</option>
              <option value="gemini">Gemini</option>
              <option value="grok">Grok</option>
            </select>
            <input
              type="text"
              id="new-account-nickname"
              class="form-input"
              placeholder="Takma ad (opsiyonel)"
            />
            <div class="file-input-group">
              <button class="btn btn-secondary" id="new-account-avatar-browse">
                Dosya Seç
              </button>
              <div class="new-account-avatar-preview" id="new-account-avatar-preview">
                <div class="avatar-placeholder-text">Avatar seçilmedi</div>
              </div>
            </div>
            <button class="btn btn-primary" id="settings-create-account">
              Hesap Ekle
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- General Settings removed: per-AI selectors are used exclusively -->

    <!-- Save/Reset buttons removed: changes are applied immediately -->
    <div class="settings-actions">
      <div
        class="form-hint"
        id="settings-status"
        style="margin-right: 12px"
      ></div>
    </div>
  </div>
</div>
