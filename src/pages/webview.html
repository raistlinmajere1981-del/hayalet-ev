<div class="page hidden" id="page-webview">
  <div class="webview-container">
    <div class="webview-split">
      <!-- AI1 Webview Panel -->
      <div class="webview-panel">
        <div class="webview-header">
          <div class="webview-title">
            <h3 id="ai1-title"></h3>
          </div>
          <div class="webview-controls">
            <button class="btn btn-small btn-secondary" id="ai1-devtools-btn">
              DevTools
            </button>
          </div>
        </div>
        <div class="webview-url-bar">
          <div class="webview-url-text" id="ai1-url-display">-</div>
        </div>
        <div class="webview-wrapper" id="ai1-webview-mount">
          <!-- Overlay - webview üzerinde gösterilir -->
          <div class="webview-overlay" id="ai1-webview-overlay">
            <div class="overlay-icon">🔌</div>
            <div class="overlay-title">Hesap Atanmadı</div>
            <div class="overlay-subtitle">Settings'ten hesap atayın</div>
          </div>
          <!-- Webview will be mounted here dynamically -->
        </div>
      </div>

      <!-- AI2 Webview Panel -->
      <div class="webview-panel">
        <div class="webview-header">
          <div class="webview-title">
            <h3 id="ai2-title"></h3>
          </div>
          <div class="webview-controls">
            <button class="btn btn-small btn-secondary" id="ai2-devtools-btn">
              DevTools
            </button>
          </div>
        </div>
        <div class="webview-url-bar">
          <div class="webview-url-text" id="ai2-url-display">-</div>
        </div>
        <div class="webview-wrapper" id="ai2-webview-mount">
          <!-- Overlay - webview üzerinde gösterilir -->
          <div class="webview-overlay" id="ai2-webview-overlay">
            <div class="overlay-icon">🔌</div>
            <div class="overlay-title">Hesap Atanmadı</div>
            <div class="overlay-subtitle">Settings'ten hesap atayın</div>
          </div>
          <!-- Webview will be mounted here dynamically -->
        </div>
      </div>
    </div>
  </div>
</div>
