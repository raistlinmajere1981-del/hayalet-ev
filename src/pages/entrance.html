<section class="page page-entrance is-hidden" id="page-entrance" aria-labelledby="page-entrance-title">
  <h2
    class="visually-hidden"
    id="page-entrance-title"
    data-shell-i18n-text="sideNav.entranceLabel"
  ></h2>
  <div class="entrance-page">
    <div class="slot-grid">
      <div class="slot-card glass-panel ds-surface-card ds-surface-card--stack" data-slot="ai1">
        <div class="slot-header">
          <div class="slot-header-top">
            <div class="slot-avatar-wrapper">
              <div class="avatar-placeholder img-cover" id="ai1-avatar"></div>
              <span class="slot-status-dot" id="ai1-status-dot"></span>
            </div>
            <div class="slot-info">
              <span class="slot-nickname" id="ai1-nickname">AI1</span>
              <select id="ai1-account-select" class="select-compact"></select>
            </div>
            <div class="slot-methods-column">
              <div class="setting-group">
                <label class="setting-label" data-i18n-text="slot.messageLabel"></label>
                <select
                  id="ai1-msg-method"
                  class="select-compact"
                  title=""
                  data-i18n-title="slot.messageMethodTitle"
                >
                  <option value="injection" data-i18n-text="slot.methods.injection"></option>
                  <option value="xdotools" data-i18n-text="slot.methods.xdotools"></option>
                </select>
              </div>
              <div class="setting-group">
                <label class="setting-label" data-i18n-text="slot.fileLabel"></label>
                <select
                  id="ai1-file-method"
                  class="select-compact"
                  title=""
                  data-i18n-title="slot.fileMethodTitle"
                >
                  <option value="dragdrop" data-i18n-text="slot.methods.dragdrop"></option>
                  <option value="injection" data-i18n-text="slot.methods.injection"></option>
                  <option value="xdotools" data-i18n-text="slot.methods.xdotools"></option>
                  <option value="uguu" data-i18n-text="slot.methods.uguu"></option>
                  <option value="catbox" data-i18n-text="slot.methods.catbox"></option>
                  <option value="googledrive" data-i18n-text="slot.methods.googledrive"></option>
                </select>
              </div>
            </div>
            <div class="slot-actions">
              <div class="slot-checkboxes-column">
                <label
                  class="ds-choice-chip ds-choice-chip--segmented"
                  title=""
                  data-i18n-title="slot.catchTitle"
                >
                  <input type="checkbox" id="ai1-catch-check" />
                  <span data-i18n-text="slot.catchLabel"></span>
                </label>
                <label
                  class="ds-choice-chip ds-choice-chip--segmented"
                  title=""
                  data-i18n-title="slot.resumeTitle"
                >
                  <input type="checkbox" id="ai1-resume-last-session-check" />
                  <span data-i18n-text="slot.resumeLabel"></span>
                </label>
                <label
                  class="ds-choice-chip ds-choice-chip--segmented"
                  title=""
                  data-i18n-title="slot.rememberTitle"
                >
                  <input type="checkbox" id="ai1-remember-connection-check" />
                  <span data-i18n-text="slot.rememberLabel"></span>
                </label>
              </div>
              <button
                class="btn btn-primary btn-sm slot-connect-btn"
                id="ai1-toggle-btn"
                data-i18n-text="slot.selectAccount"
              ></button>
              <button
                class="btn btn-ghost btn-icon btn-sm"
                id="ai1-devtools-btn"
                title=""
                aria-label=""
                data-i18n-title="slot.devtoolsTitle"
                data-i18n-aria-label="slot.devtoolsTitle"
              >
                🔧
              </button>
              <button
                class="btn btn-ghost btn-icon btn-sm slot-test-btn"
                id="ai1-test-btn"
                title=""
                aria-label=""
                data-i18n-title="slot.providerTestTitle"
                data-i18n-aria-label="slot.providerTestTitle"
                disabled
              >
                🧪
              </button>
              <button
                class="btn btn-ghost btn-icon btn-sm slot-sync-btn"
                id="ai1-sync-btn"
                title=""
                aria-label=""
                data-i18n-title="slot.providerSyncTitle"
                data-i18n-aria-label="slot.providerSyncTitle"
                disabled
              >
                🔄
              </button>
            </div>
          </div>
        </div>
        <div class="slot-url-bar">
          <div class="slot-url" id="ai1-url-display">-</div>
        </div>
        <div class="slot-webview-container" id="ai1-webview-mount">
          <div class="webview-overlay is-empty" id="ai1-webview-overlay">
            <div class="overlay-icon"></div>
            <div class="overlay-title" data-i18n-text="webview.noAccount.title"></div>
            <div class="overlay-subtitle" data-i18n-text="webview.noAccount.subtitle"></div>
          </div>
        </div>
        <div class="webview-overlay is-hidden scenario-slot-overlay" id="ai1-scenario-overlay"></div>
      </div>

      <div class="slot-card glass-panel ds-surface-card ds-surface-card--stack" data-slot="ai2">
        <div class="slot-header">
          <div class="slot-header-top">
            <div class="slot-avatar-wrapper">
              <div class="avatar-placeholder img-cover" id="ai2-avatar"></div>
              <span class="slot-status-dot" id="ai2-status-dot"></span>
            </div>
            <div class="slot-info">
              <span class="slot-nickname" id="ai2-nickname">AI2</span>
              <select id="ai2-account-select" class="select-compact"></select>
            </div>
            <div class="slot-methods-column">
              <div class="setting-group">
                <label class="setting-label" data-i18n-text="slot.messageLabel"></label>
                <select
                  id="ai2-msg-method"
                  class="select-compact"
                  title=""
                  data-i18n-title="slot.messageMethodTitle"
                >
                  <option value="injection" data-i18n-text="slot.methods.injection"></option>
                  <option value="xdotools" data-i18n-text="slot.methods.xdotools"></option>
                </select>
              </div>
              <div class="setting-group">
                <label class="setting-label" data-i18n-text="slot.fileLabel"></label>
                <select
                  id="ai2-file-method"
                  class="select-compact"
                  title=""
                  data-i18n-title="slot.fileMethodTitle"
                >
                  <option value="dragdrop" data-i18n-text="slot.methods.dragdrop"></option>
                  <option value="injection" data-i18n-text="slot.methods.injection"></option>
                  <option value="xdotools" data-i18n-text="slot.methods.xdotools"></option>
                  <option value="uguu" data-i18n-text="slot.methods.uguu"></option>
                  <option value="catbox" data-i18n-text="slot.methods.catbox"></option>
                  <option value="googledrive" data-i18n-text="slot.methods.googledrive"></option>
                </select>
              </div>
            </div>
            <div class="slot-actions">
              <div class="slot-checkboxes-column">
                <label
                  class="ds-choice-chip ds-choice-chip--segmented"
                  title=""
                  data-i18n-title="slot.catchTitle"
                >
                  <input type="checkbox" id="ai2-catch-check" />
                  <span data-i18n-text="slot.catchLabel"></span>
                </label>
                <label
                  class="ds-choice-chip ds-choice-chip--segmented"
                  title=""
                  data-i18n-title="slot.resumeTitle"
                >
                  <input type="checkbox" id="ai2-resume-last-session-check" />
                  <span data-i18n-text="slot.resumeLabel"></span>
                </label>
                <label
                  class="ds-choice-chip ds-choice-chip--segmented"
                  title=""
                  data-i18n-title="slot.rememberTitle"
                >
                  <input type="checkbox" id="ai2-remember-connection-check" />
                  <span data-i18n-text="slot.rememberLabel"></span>
                </label>
              </div>
              <button
                class="btn btn-primary btn-sm slot-connect-btn"
                id="ai2-toggle-btn"
                data-i18n-text="slot.selectAccount"
              ></button>
              <button
                class="btn btn-ghost btn-icon btn-sm"
                id="ai2-devtools-btn"
                title=""
                aria-label=""
                data-i18n-title="slot.devtoolsTitle"
                data-i18n-aria-label="slot.devtoolsTitle"
              >
                🔧
              </button>
              <button
                class="btn btn-ghost btn-icon btn-sm slot-test-btn"
                id="ai2-test-btn"
                title=""
                aria-label=""
                data-i18n-title="slot.providerTestTitle"
                data-i18n-aria-label="slot.providerTestTitle"
                disabled
              >
                🧪
              </button>
              <button
                class="btn btn-ghost btn-icon btn-sm slot-sync-btn"
                id="ai2-sync-btn"
                title=""
                aria-label=""
                data-i18n-title="slot.providerSyncTitle"
                data-i18n-aria-label="slot.providerSyncTitle"
                disabled
              >
                🔄
              </button>
            </div>
          </div>
        </div>
        <div class="slot-url-bar">
          <div class="slot-url" id="ai2-url-display">-</div>
        </div>
        <div class="slot-webview-container" id="ai2-webview-mount">
          <div class="webview-overlay is-empty" id="ai2-webview-overlay">
            <div class="overlay-icon"></div>
            <div class="overlay-title" data-i18n-text="webview.noAccount.title"></div>
            <div class="overlay-subtitle" data-i18n-text="webview.noAccount.subtitle"></div>
          </div>
        </div>
        <div class="webview-overlay is-hidden scenario-slot-overlay" id="ai2-scenario-overlay"></div>
      </div>
    </div>

    <div class="control-panel-accordion ds-surface-card ds-surface-card--stack">
      <button class="accordion-toggle" id="settings-accordion-toggle" aria-expanded="false">
        <span class="accordion-icon">⚙️</span>
        <span class="accordion-title" data-i18n-text="panels.settings"></span>
        <span class="accordion-chevron">▼</span>
      </button>

      <div class="accordion-content" id="settings-accordion-content">
        <div class="accordion-panels">
          <div
            class="entrance-panel glass-panel ds-surface-card ds-surface-card--stack"
            data-panel="user"
          >
            <div class="entrance-panel__header ds-surface-card__header">
              <span class="entrance-panel__title ds-panel-title" data-i18n-text="panels.user"></span>
            </div>
            <div class="entrance-panel__content">
              <div class="user-settings-column">
                <div class="user-avatar-row">
                  <div
                    class="user-avatar-wrapper"
                    id="user-avatar-edit-btn"
                    title=""
                    role="button"
                    tabindex="0"
                    aria-label=""
                    data-i18n-title="user.changeAvatarTitle"
                    data-i18n-aria-label="user.changeAvatarTitle"
                  >
                    <div class="avatar-placeholder img-cover" id="user-avatar"></div>
                    <div class="user-edit-overlay">📷</div>
                  </div>
                  <input
                    type="text"
                    id="user-nickname-input"
                    class="input input-sm"
                    placeholder=""
                    data-i18n-placeholder="user.nicknamePlaceholder"
                  />
                </div>
                <div class="setting-group">
                  <label
                    class="form-label"
                    id="app-language-label"
                    for="app-language-select"
                    data-i18n-text="user.language.label"
                  ></label>
                  <select id="app-language-select" class="select select-sm"></select>
                </div>
                <div class="gdrive-status-row">
                  <label class="form-label" data-i18n-text="user.googleDrive.label"></label>
                  <span
                    class="status-dot"
                    id="gdrive-status-dot"
                    title=""
                    data-i18n-title="user.googleDrive.statusTitle"
                  ></span>
                </div>
                <input
                  type="text"
                  id="gdrive-client-id"
                  class="input input-sm"
                  placeholder=""
                  data-i18n-placeholder="user.googleDrive.clientIdPlaceholder"
                />
                <input
                  type="text"
                  id="gdrive-client-secret"
                  class="input input-sm"
                  placeholder=""
                  data-i18n-placeholder="user.googleDrive.clientSecretPlaceholder"
                />
                <input
                  type="text"
                  id="gdrive-auth-code"
                  class="input input-sm"
                  placeholder=""
                  data-i18n-placeholder="user.googleDrive.authCodePlaceholder"
                />
                <div class="btn-group-inline">
                  <button
                    class="btn btn-secondary btn-sm"
                    id="gdrive-start-auth"
                    data-i18n-text="user.googleDrive.startAuth"
                  ></button>
                  <button
                    class="btn btn-primary btn-sm"
                    id="gdrive-connect-btn"
                    data-i18n-text="user.googleDrive.connect"
                  ></button>
                </div>
              </div>
            </div>
          </div>

          <div
            class="entrance-panel glass-panel ds-surface-card ds-surface-card--stack"
            data-panel="accounts"
          >
            <div class="entrance-panel__header ds-surface-card__header">
              <span class="entrance-panel__title ds-panel-title" data-i18n-text="panels.accounts"></span>
            </div>
            <div class="entrance-panel__content">
              <div class="accounts-container">
                <div class="account-list" id="account-list"></div>
                <div class="account-form">
                  <div class="account-form-header">
                    <span id="account-form-title" data-i18n-text="accounts.form.createTitle"></span>
                    <span id="account-status-msg" class="form-hint"></span>
                  </div>
                  <div class="account-form-body">
                    <input
                      type="text"
                      id="new-account-email"
                      class="input input-sm"
                      placeholder=""
                      data-i18n-placeholder="accounts.form.emailPlaceholder"
                    />
                    <input
                      type="text"
                      id="new-account-nickname"
                      class="input input-sm"
                      placeholder=""
                      data-i18n-placeholder="accounts.form.nicknamePlaceholder"
                    />
                    <select id="new-account-provider" class="select">
                      <option value="chatgpt">ChatGPT</option>
                      <option value="gemini">Gemini</option>
                      <option value="grok">Grok</option>
                    </select>
                    <div class="account-form-avatar-row">
                      <div class="avatar-preview-box" id="new-account-avatar-preview"></div>
                      <button
                        class="btn btn-ghost btn-sm"
                        id="new-account-avatar-browse"
                        data-i18n-text="accounts.form.avatarButton"
                      ></button>
                      <button
                        class="btn btn-primary btn-sm"
                        id="settings-create-account"
                        data-i18n-text="accounts.form.createAction"
                      ></button>
                      <button
                        class="btn btn-danger btn-sm is-hidden"
                        id="settings-cancel-edit"
                        data-i18n-text="accounts.form.cancelAction"
                      ></button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div
            class="entrance-panel glass-panel ds-surface-card ds-surface-card--stack"
            data-panel="whisper"
          >
            <div class="entrance-panel__header ds-surface-card__header">
              <span class="entrance-panel__title ds-panel-title" data-i18n-text="panels.whisper"></span>
            </div>
            <div class="entrance-panel__content">
              <div class="entrance-whisper-container">
                <div class="entrance-whisper-header">
                  <button
                    class="btn btn-ghost btn-sm"
                    id="whisper-clear-btn"
                    data-i18n-text="whisper.clear"
                  ></button>
                </div>
                <div
                  class="entrance-whisper-list"
                  id="whisper-pending-list"
                  aria-live="polite"
                ></div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</section>

<script type="module" src="/js/pages/entrance.ts"></script>
