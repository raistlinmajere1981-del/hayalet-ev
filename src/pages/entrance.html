<div class="page hidden" id="page-entrance">
  <div class="entrance-page">

    <!-- SLOT CARDS GRID -->
    <div class="slot-grid">
      
      <!-- AI1 SLOT CARD -->
      <div class="slot-card" data-slot="ai1">
        <div class="slot-header">
          <!-- Üst Satır: Avatar, Info, Metodlar, Actions -->
          <div class="slot-header-top">
            <div class="slot-avatar-wrapper">
              <div class="avatar-placeholder img-cover" id="ai1-avatar"></div>
              <span class="slot-status-dot" id="ai1-status-dot"></span>
            </div>
            <div class="slot-info">
              <span class="slot-nickname" id="ai1-nickname">AI1</span>
              <select id="ai1-account-select" class="slot-provider-select"></select>
            </div>
            <!-- Metodlar (üstte mesaj, altta dosya) -->
            <div class="slot-methods-column">
              <div class="setting-group">
                <label class="setting-label">Mesaj:</label>
                <select id="ai1-msg-method" class="select-method" title="Mesaj Gönderme Metodu">
                  <option value="injection">Injection</option>
                  <option value="xdotools">XdoTools</option>
                </select>
              </div>
              <div class="setting-group">
                <label class="setting-label">Dosya:</label>
                <select id="ai1-file-method" class="select-method" title="Dosya Gönderme Metodu">
                  <option value="dragdrop">Drag & Drop</option>
                  <option value="injection">Injection</option>
                  <option value="xdotools">XdoTools</option>
                  <option value="uguu">Uguu</option>
                  <option value="catbox">Catbox</option>
                  <option value="googledrive">Google Drive</option>
                </select>
              </div>
            </div>
            <div class="slot-actions">
              <label class="catch-label" title="AI komutlarını yakala ve işle">
                <input type="checkbox" id="ai1-catch-check">
                <span>Komutları Yakala</span>
              </label>
              <button class="btn btn-primary btn-sm slot-connect-btn" id="ai1-toggle-btn">Hesap Seçin</button>
              <button class="btn btn-ghost btn-icon btn-sm" id="ai1-devtools-btn" title="DevTools">🔧</button>
            </div>
          </div>
        </div>
        <div class="slot-url-bar">
          <div class="slot-url" id="ai1-url-display">-</div>
        </div>
        <div class="slot-webview-container" id="ai1-webview-mount">
          <!-- Overlay -->
          <div class="webview-overlay" id="ai1-webview-overlay">
            <div class="overlay-icon">🔌</div>
            <div class="overlay-title">Hesap Seçilmedi</div>
            <div class="overlay-subtitle">Yukarıdan hesap seçin ve bağlanın</div>
          </div>
          <!-- Webview will be mounted here dynamically -->
        </div>
      </div>

      <!-- AI2 SLOT CARD -->
      <div class="slot-card" data-slot="ai2">
        <div class="slot-header">
          <!-- Üst Satır: Avatar, Info, Metodlar, Actions -->
          <div class="slot-header-top">
            <div class="slot-avatar-wrapper">
              <div class="avatar-placeholder img-cover" id="ai2-avatar"></div>
              <span class="slot-status-dot" id="ai2-status-dot"></span>
            </div>
            <div class="slot-info">
              <span class="slot-nickname" id="ai2-nickname">AI2</span>
              <select id="ai2-account-select" class="slot-provider-select"></select>
            </div>
            <!-- Metodlar (üstte mesaj, altta dosya) -->
            <div class="slot-methods-column">
              <div class="setting-group">
                <label class="setting-label">Mesaj:</label>
                <select id="ai2-msg-method" class="select-method" title="Mesaj Gönderme Metodu">
                  <option value="injection">Injection</option>
                  <option value="xdotools">XdoTools</option>
                </select>
              </div>
              <div class="setting-group">
                <label class="setting-label">Dosya:</label>
                <select id="ai2-file-method" class="select-method" title="Dosya Gönderme Metodu">
                  <option value="dragdrop">Drag & Drop</option>
                  <option value="injection">Injection</option>
                  <option value="xdotools">XdoTools</option>
                  <option value="uguu">Uguu</option>
                  <option value="catbox">Catbox</option>
                  <option value="googledrive">Google Drive</option>
                </select>
              </div>
            </div>
            <div class="slot-actions">
              <label class="catch-label" title="AI komutlarını yakala ve işle">
                <input type="checkbox" id="ai2-catch-check">
                <span>Komutları Yakala</span>
              </label>
              <button class="btn btn-primary btn-sm slot-connect-btn" id="ai2-toggle-btn">Hesap Seçin</button>
              <button class="btn btn-ghost btn-icon btn-sm" id="ai2-devtools-btn" title="DevTools">🔧</button>
            </div>
          </div>
        </div>
        <div class="slot-url-bar">
          <div class="slot-url" id="ai2-url-display">-</div>
        </div>
        <div class="slot-webview-container" id="ai2-webview-mount">
          <!-- Overlay -->
          <div class="webview-overlay" id="ai2-webview-overlay">
            <div class="overlay-icon">🔌</div>
            <div class="overlay-title">Hesap Seçilmedi</div>
            <div class="overlay-subtitle">Yukarıdan hesap seçin ve bağlanın</div>
          </div>
          <!-- Webview will be mounted here dynamically -->
        </div>
      </div>

    </div>

    <!-- CONTROL PANEL (Accordion) -->
    <div class="control-panel-accordion">
      <button class="accordion-toggle" id="settings-accordion-toggle" aria-expanded="true">
        <span class="accordion-icon">⚙️</span>
        <span class="accordion-title">Ayarlar</span>
        <span class="accordion-chevron">▼</span>
      </button>
      
      <div class="accordion-content open" id="settings-accordion-content">
        <div class="accordion-panels">
          
          <!-- USER SETTINGS -->
          <div class="panel-item" data-panel="user">
            <div class="panel-header">
              <span class="panel-title">KULLANICI & DRiVE</span>
            </div>
            <div class="panel-content">
              <div class="user-settings-column">
                <!-- Avatar - Nickname -->
                <div class="user-avatar-row">
                  <div class="user-avatar-wrapper" id="user-avatar-edit-btn" title="Avatarı Değiştir">
                    <div class="avatar-placeholder img-cover" id="user-avatar"></div>
                    <div class="user-edit-overlay">📷</div>
                  </div>
                  <input type="text" id="user-nickname-input" class="input input-sm" value="Kullanıcı" placeholder="Takma Ad">
                </div>
                <!-- Google Drive - Status (sadece dot) -->
                <div class="gdrive-status-row">
                  <label class="form-label">Google Drive</label>
                  <span class="status-dot" id="gdrive-status-dot" title="Bağlantı Durumu"></span>
                </div>
                <!-- Client ID -->
                <input type="text" id="gdrive-client-id" class="input input-sm" placeholder="Client ID">
                <!-- Client Secret -->
                <input type="text" id="gdrive-client-secret" class="input input-sm" placeholder="Client Secret">
                <!-- Auth Code -->
                <input type="text" id="gdrive-auth-code" class="input input-sm" placeholder="Auth Code">
                <!-- Auth URL - Bağlan butonları -->
                <div class="btn-group-inline">
                  <button class="btn btn-secondary btn-sm" id="gdrive-start-auth">Auth URL</button>
                  <button class="btn btn-primary btn-sm" id="gdrive-connect-btn">Bağlan</button>
                </div>
              </div>
            </div>
          </div>

          <!-- ACCOUNTS -->
          <div class="panel-item" data-panel="accounts">
            <div class="panel-header">
              <span class="panel-title">HESAP YÖNETİMİ</span>
            </div>
            <div class="panel-content">
              <div class="accounts-container">
                <div class="account-list" id="account-list">
                  <!-- Dynamic Content -->
                </div>
                <div class="account-form">
                  <div class="account-form-header">
                    <span>Yeni Hesap</span>
                    <span id="account-status-msg" class="form-hint"></span>
                  </div>
                  <div class="account-form-body">
                    <input type="text" id="new-account-email" class="input input-sm" placeholder="Email">
                    <input type="text" id="new-account-nickname" class="input input-sm" placeholder="Takma Ad">
                    <select id="new-account-provider" class="select">
                      <option value="chatgpt">ChatGPT</option>
                      <option value="gemini">Gemini</option>
                      <option value="grok">Grok</option>
                    </select>
                    <div class="account-form-avatar-row">
                      <div class="avatar-preview-box" id="new-account-avatar-preview"></div>
                      <button class="btn btn-ghost btn-sm" id="new-account-avatar-browse">📷 Avatar</button>
                      <button class="btn btn-primary btn-sm" id="settings-create-account">Ekle</button>
                      <button class="btn btn-danger btn-sm hidden" id="settings-cancel-edit">İptal</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- WHISPER QUEUE -->
          <div class="panel-item" data-panel="whisper">
            <div class="panel-header">
              <span class="panel-title">BEKLEYEN KOMUTLAR</span>
            </div>
            <div class="panel-content">
              <div class="whisper-container">
                <div class="whisper-header">
                  <button class="btn btn-ghost btn-sm" id="whisper-clear-btn">🗑️ Temizle</button>
                </div>
                <div class="whisper-list" id="whisper-pending-list">
                  <!-- Dynamic Content -->
                </div>
              </div>
            </div>
          </div>

          <!-- REPORT PANEL -->
          <div class="panel-item" data-panel="report">
            <div class="panel-header">
              <span class="panel-title">CANLI RAPOR</span>
              <button class="btn btn-ghost btn-xs" id="report-modal-open" title="Tam Ekran">⛶</button>
            </div>
            <div class="panel-content">
              <div class="report-container">
                <div class="report-content" id="entrance-report-content">
                  <div class="log-entry">Sistem başlatıldı...</div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>
</div>
