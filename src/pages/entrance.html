<div id="live-log-overlay" class="live-log-overlay hidden" aria-hidden="true">
  <div class="live-log-backdrop" id="live-log-backdrop"></div>

    role="dialog"
    aria-modal="true"
    aria-label="Live Log Center"
    data-i18n-aria-label="liveLog.dialogAriaLabel"
  >
    <div class="live-log-header">
      <h3 data-i18n-text="liveLog.title">Live Log Center</h3>
      <div class="live-log-header-actions">
        <button
          class="btn btn-ghost btn-sm"

          title="Pause stream"
          data-i18n-title="liveLog.pauseTitle"
          data-i18n-text="liveLog.pause"
        >
          Pause
        </button>
        <button
          class="btn btn-ghost btn-sm"
          id="live-log-clear"
          title="Clear list"
          data-i18n-title="liveLog.clearTitle"
          data-i18n-text="liveLog.clear"
        >
          Clear
        </button>
        <button
          class="btn btn-ghost btn-sm"
          id="live-log-close"
          title="Close"
          data-i18n-title="liveLog.closeTitle"
          data-i18n-text="liveLog.close"
        >
          Close
        </button>
      </div>
    </div>

    <div class="live-log-toolbar">
      <div class="live-log-app-tabs" id="live-log-app-tabs">
        <button class="btn btn-secondary btn-sm is-active" data-app="app" type="button">app</button>
        <button class="btn btn-secondary btn-sm" data-app="mcp-server" type="button">
          mcp-server
        </button>
        <button class="btn btn-secondary btn-sm" data-app="ghost-agent" type="button">
          ghost-agent
        </button>
      </div>
      <label class="live-log-control">
        <span data-i18n-text="liveLog.sessionLabel">Session</span>
        <select id="live-log-session-select" class="select"></select>
      </label>
      <label class="live-log-control">
        <span data-i18n-text="liveLog.levelLabel">Level</span>
        <select id="live-log-level-select" class="select">
          <option value="all" data-i18n-text="liveLog.levels.all">all</option>
          <option value="error" data-i18n-text="liveLog.levels.error">error</option>
          <option value="warning" data-i18n-text="liveLog.levels.warning">warning</option>
          <option value="info" data-i18n-text="liveLog.levels.info">info</option>
          <option value="success" data-i18n-text="liveLog.levels.success">success</option>
          <option value="debug" data-i18n-text="liveLog.levels.debug">debug</option>
        </select>
      </label>
      <label class="live-log-control live-log-control-search">
        <span data-i18n-text="liveLog.searchLabel">Search</span>
        <input
          id="live-log-search"
          class="input"
          type="text"
          placeholder="message/category/source"
          data-i18n-placeholder="liveLog.searchPlaceholder"
        />
      </label>
      <div class="live-log-metrics" id="live-log-metrics"></div>
    </div>

    <div class="live-log-body">
      <div class="live-log-content" id="live-log-content"></div>
      <aside class="live-log-detail">
        <div class="live-log-detail-title" data-i18n-text="liveLog.detailTitle">Entry Detail</div>
        <div
          class="live-log-detail-meta"
          id="live-log-meta"
          data-i18n-text="liveLog.noEntrySelected"
        >
          No entry selected
        </div>
        <pre class="live-log-detail-context" id="live-log-context"></pre>
      </aside>
    </div>
  </div>
