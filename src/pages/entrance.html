<div class="page hidden" id="page-entrance">

      <!-- AI1 SLOT CARD -->

        <div class="slot-header">
          <!-- Üst Satır: Avatar, Info, Metodlar, Actions -->

            <div class="slot-avatar-wrapper">
              <div class="avatar-placeholder img-cover" id="ai1-avatar"></div>
              <span class="slot-status-dot" id="ai1-status-dot"></span>
            </div>
            <div class="slot-info">
              <span class="slot-nickname" id="ai1-nickname">AI1</span>
              <select id="ai1-account-select" class="select-compact"></select>
            </div>
            <!-- Metodlar (üstte mesaj, altta dosya) -->
            <div class="slot-methods-column">
              <div class="setting-group">
                <label class="setting-label">Mesaj:</label>
                <select id="ai1-msg-method" class="select-compact" title="Mesaj Gönderme Metodu">
                  <option value="injection">Injection</option>
                  <option value="xdotools">XdoTools</option>
                </select>
              </div>
              <div class="setting-group">
                <label class="setting-label">Dosya:</label>
                <select id="ai1-file-method" class="select-compact" title="Dosya Gönderme Metodu">
                  <option value="dragdrop">Drag & Drop</option>
                  <option value="injection">Injection</option>
                  <option value="xdotools">XdoTools</option>
                  <option value="uguu">Uguu</option>
                  <option value="catbox">Catbox</option>
                  <option value="googledrive">Google Drive</option>
                </select>
              </div>
            </div>
            <div class="slot-actions">
              <div class="slot-checkboxes-column">
                <label class="catch-label" title="AI komutlarını yakala ve işle">
                  <input type="checkbox" id="ai1-catch-check" />
                  <span>Komutları Yakala</span>
                </label>
                <label class="catch-label" title="Bağlanınca son oturuma dön">
                  <input type="checkbox" id="ai1-resume-last-session-check" />
                  <span>Son sessiona devam</span>
                </label>
                <label
                  class="catch-label"
                  title="Bağlantı durumunu hatırla ve açılışta otomatik bağlan"
                >
                  <input type="checkbox" id="ai1-remember-connection-check" />
                  <span>Bağlantı durumunu hatırla</span>
                </label>
              </div>
              <button class="btn btn-primary btn-sm slot-connect-btn" id="ai1-toggle-btn">
                Hesap Seçin
              </button>
              <button class="btn btn-ghost btn-icon btn-sm" id="ai1-devtools-btn" title="DevTools">
                🔧
              </button>
              <button
                class="btn btn-ghost btn-icon btn-sm"
                id="ai1-test-btn"
                title="Provider Test"
                disabled
              >
                🧪
              </button>
              <button
                class="btn btn-ghost btn-icon btn-sm"
                id="ai1-sync-btn"
                title="Provider Sync"
                disabled
              >
                🔄
              </button>
            </div>
          </div>
        </div>
        <div class="slot-url-bar">
          <div class="slot-url" id="ai1-url-display">-</div>
        </div>
        <div class="slot-webview-container" id="ai1-webview-mount">
          <!-- Overlay -->
          <div class="webview-overlay empty" id="ai1-webview-overlay">
            <div class="overlay-icon"></div>
            <div class="overlay-title">Hesap Seçilmedi</div>
            <div class="overlay-subtitle">Yukarıdan hesap seçin ve bağlanın</div>
          </div>
          <!-- Webview will be mounted here dynamically -->
        </div>
        <div class="webview-overlay hidden scenario-slot-overlay" id="ai1-scenario-overlay"></div>
      </div>

                  <span>Komutları Yakala</span>

                <label class="catch-label" title="Bağlanınca son oturuma dön">

              <button

        <div class="slot-webview-container" id="ai2-webview-mount">

    <!-- CONTROL PANEL (Accordion) -->
    <div class="control-panel-accordion">
      <button class="accordion-toggle" id="settings-accordion-toggle" aria-expanded="false">
        <span class="accordion-icon">⚙️</span>
        <span class="accordion-title">Ayarlar</span>
        <span class="accordion-chevron">▼</span>
      </button>

      <div class="accordion-content" id="settings-accordion-content">
        <div class="accordion-panels">
          <!-- USER SETTINGS -->
          <div class="panel-item glass-panel" data-panel="user">
            <div class="panel-header">
              <span class="panel-title">KULLANICI & DRiVE</span>
            </div>
            <div class="panel-content">
              <div class="user-settings-column">
                <!-- Avatar - Nickname -->
                <div class="user-avatar-row">
                  <div
                    class="user-avatar-wrapper"
                    id="user-avatar-edit-btn"
                    title="Avatarı Değiştir"
                  >
                    <div class="avatar-placeholder img-cover" id="user-avatar"></div>
                    <div class="user-edit-overlay">📷</div>
                  </div>
                  <input
                    type="text"
                    id="user-nickname-input"
                    class="input input-sm"
                    value="Kullanıcı"
                    placeholder="Takma Ad"
                  />
                </div>
                <div class="setting-group">
                  <label class="form-label" for="app-language-select">Uygulama Dili</label>
                  <select id="app-language-select" class="select select-sm">
                    <option value="tr">Türkçe</option>
                    <option value="en">İngilizce</option>
                  </select>
                </div>
                <!-- Google Drive - Status (sadece dot) -->
                <div class="gdrive-status-row">
                  <label class="form-label">Google Drive</label>
                  <span class="status-dot" id="gdrive-status-dot" title="Bağlantı Durumu"></span>
                </div>
                <!-- Client ID -->
                <input
                  type="text"
                  id="gdrive-client-id"
                  class="input input-sm"
                  placeholder="Client ID"
                />
                <!-- Client Secret -->
                <input
                  type="text"
                  id="gdrive-client-secret"
                  class="input input-sm"
                  placeholder="Client Secret"
                />
                <!-- Auth Code -->
                <input
                  type="text"
                  id="gdrive-auth-code"
                  class="input input-sm"
                  placeholder="Auth Code"
                />
                <!-- Auth URL - Bağlan butonları -->
                <div class="btn-group-inline">
                  <button class="btn btn-secondary btn-sm" id="gdrive-start-auth">Auth URL</button>
                  <button class="btn btn-primary btn-sm" id="gdrive-connect-btn">Bağlan</button>
                </div>
              </div>
            </div>
          </div>

          <!-- ACCOUNTS -->
          <div class="panel-item glass-panel" data-panel="accounts">
            <div class="panel-header">
              <span class="panel-title">HESAP YÖNETİMİ</span>
            </div>

              <div class="accounts-container">

                  <!-- Dynamic Content -->
                </div>
                <div class="account-form">
                  <div class="account-form-header">
                    <span>Yeni Hesap</span>
                    <span id="account-status-msg" class="form-hint"></span>
                  </div>
                  <div class="account-form-body">
                    <input
                      type="text"
                      id="new-account-email"
                      class="input input-sm"
                      placeholder="Email"
                    />
                    <input
                      type="text"
                      id="new-account-nickname"
                      class="input input-sm"
                      placeholder="Takma Ad"
                    />
                    <select id="new-account-provider" class="select">
                      <option value="chatgpt">ChatGPT</option>
                      <option value="gemini">Gemini</option>
                      <option value="grok">Grok</option>
                    </select>
                    <div class="account-form-avatar-row">
                      <div class="avatar-preview-box" id="new-account-avatar-preview"></div>
                      <button class="btn btn-ghost btn-sm" id="new-account-avatar-browse">
                        📷 Avatar
                      </button>
                      <button class="btn btn-primary btn-sm" id="settings-create-account">
                        Ekle
                      </button>
                      <button class="btn btn-danger btn-sm hidden" id="settings-cancel-edit">
                        İptal
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- WHISPER QUEUE -->
          <div class="panel-item glass-panel" data-panel="whisper">
            <div class="panel-header">
              <span class="panel-title">BEKLEYEN KOMUTLAR</span>
            </div>
            <div class="panel-content">
              <div class="entrance-whisper-container">

                </div>
                <div class="entrance-whisper-list" id="whisper-pending-list">
                  <!-- Dynamic Content -->

              </div>
            </div>
          </div>

          <!-- REPORT PANEL -->
          <div class="panel-item glass-panel" data-panel="report">
            <div class="panel-header">
              <span class="panel-title">CANLI RAPOR</span>
            </div>
            <div class="panel-content">
              <div class="report-container">

<!-- ADVANCED LIVE LOG OVERLAY -->
<div id="live-log-overlay" class="live-log-overlay hidden" aria-hidden="true">
  <div class="live-log-backdrop" id="live-log-backdrop"></div>
  <div class="live-log-shell" role="dialog" aria-modal="true" aria-label="Canli Log Merkezi">
    <div class="live-log-header">
      <h3>Canli Log Merkezi</h3>
      <div class="live-log-header-actions">
        <button class="btn btn-ghost btn-sm" id="live-log-pause" title="Akisi durdur">Pause</button>
        <button class="btn btn-ghost btn-sm" id="live-log-clear" title="Listeyi temizle">
          Clear
        </button>
        <button class="btn btn-ghost btn-sm" id="live-log-close" title="Kapat">Close</button>
      </div>
    </div>

    <div class="live-log-toolbar">
      <div class="live-log-app-tabs" id="live-log-app-tabs">
        <button class="btn btn-secondary btn-sm is-active" data-app="hayalet-ev" type="button">
          hayalet-ev
        </button>
        <button class="btn btn-secondary btn-sm" data-app="mcp-server" type="button">
          mcp-server
        </button>
        <button class="btn btn-secondary btn-sm" data-app="ghost-agent" type="button">
          ghost-agent
        </button>
      </div>
      <label class="live-log-control">
        <span>Session</span>
        <select id="live-log-session-select" class="select"></select>
      </label>
      <label class="live-log-control">
        <span>Level</span>
        <select id="live-log-level-select" class="select">
          <option value="all">all</option>
          <option value="error">error</option>
          <option value="warning">warning</option>
          <option value="info">info</option>
          <option value="success">success</option>
          <option value="debug">debug</option>
        </select>
      </label>
      <label class="live-log-control live-log-control-search">
        <span>Search</span>
        <input
          id="live-log-search"
          class="input"
          type="text"
          placeholder="message/category/source"
        />
      </label>
      <div class="live-log-metrics" id="live-log-metrics">0 entries</div>
    </div>

    <div class="live-log-body">
      <div class="live-log-content" id="live-log-content"></div>
      <aside class="live-log-detail">
        <div class="live-log-detail-title">Entry Detail</div>
        <div class="live-log-detail-meta" id="live-log-meta">No entry selected</div>
        <pre class="live-log-detail-context" id="live-log-context"></pre>
      </aside>
    </div>
  </div>
</div>
