<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCode UI</title>
  
  <!-- Styles -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/messages.css">
  <link rel="stylesheet" href="styles/prompt.css">
  <link rel="stylesheet" href="styles/tools.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <span class="logo">OpenCode</span>
        <span class="status-badge" id="status-badge">Bağlantı bekleniyor</span>
        <span class="session-badge" id="session-badge" title="Session ID">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span id="session-id-text">-</span>
        </span>
      </div>
      <div class="header-right">
        <button class="btn btn-icon" id="btn-new-session" title="Yeni Oturum">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button class="btn btn-icon" id="btn-settings" title="Ayarlar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-main">
      <!-- Messages Area -->
      <div class="messages-container" id="messages-container">
        <div class="messages-list" id="messages-list">
          <!-- Welcome message -->
          <div class="welcome-message" id="welcome-message">
            <div class="welcome-icon">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
            </div>
            <h2>OpenCode'a Hoş Geldiniz</h2>
            <p>Kod yazmanıza, dosyaları düzenlemenize ve terminal komutları çalıştırmanıza yardımcı olabilirim.</p>
            <div class="quick-actions">
              <button class="quick-action" data-prompt="Bu projede ne yapılabilir?">
                <span class="icon">📊</span>
                <span>Projeyi analiz et</span>
              </button>
              <button class="quick-action" data-prompt="Bu projedeki hataları bul">
                <span class="icon">🐛</span>
                <span>Hataları bul</span>
              </button>
              <button class="quick-action" data-prompt="README.md dosyasını oluştur">
                <span class="icon">📝</span>
                <span>README oluştur</span>
              </button>
            </div>
          </div>
          <!-- Messages will be inserted here -->
        </div>
      </div>

      <!-- Prompt Area -->
      <div class="prompt-container">
        <div class="prompt-wrapper">
          <div class="prompt-attachments" id="prompt-attachments">
            <!-- Attachments will be shown here -->
          </div>
          <div class="prompt-input-wrapper">
            <textarea 
              id="prompt-input" 
              class="prompt-input" 
              placeholder="Mesajınızı yazın... (/ ile komutlar, @ ile dosya seçimi)"
              rows="1"
            ></textarea>
            <div class="prompt-actions">
              <button class="btn btn-icon" id="btn-attach" title="Dosya Ekle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                </svg>
              </button>
              <button class="btn btn-primary" id="btn-send" title="Gönder (Enter)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
              </button>
            </div>
          </div>
          <div class="prompt-hints">
            <span class="hint"><kbd>Enter</kbd> gönder</span>
            <span class="hint"><kbd>Shift+Enter</kbd> yeni satır</span>
            <span class="hint"><kbd>/</kbd> komutlar</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Permission Modal -->
    <div class="modal-overlay hidden" id="permission-modal">
      <div class="modal">
        <div class="modal-header">
          <h3>İzin Gerekiyor</h3>
        </div>
        <div class="modal-body" id="permission-body">
          <!-- Permission details will be inserted here -->
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="btn-deny">Reddet</button>
          <button class="btn btn-primary" id="btn-approve">Onayla</button>
        </div>
      </div>
    </div>

    <!-- Question Modal -->
    <div class="modal-overlay hidden" id="question-modal">
      <div class="modal">
        <div class="modal-header">
          <h3>Soru</h3>
        </div>
        <div class="modal-body" id="question-body">
          <!-- Question details will be inserted here -->
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" id="btn-answer">Cevapla</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <!-- Store modules (load first) -->
  <script src="js/stores/types.js"></script>
  <script src="js/stores/normalizers.js"></script>
  <script src="js/stores/message-store.js"></script>
  <script src="js/stores/session-store.js"></script>
  <script src="js/stores/store-bridge.js"></script>
  <script src="js/stores/index.js"></script>
  
  <!-- Core modules -->
  <script src="js/sse-client.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/message-renderer.js"></script>
  <script src="js/prompt-handler.js"></script>
  <script src="js/tool-renderer.js"></script>
  <script src="js/permission-modal.js"></script>
  <script src="js/question-modal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
