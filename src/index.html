<!doctype html>

  <body>
    <div id="splash-screen" class="splash">
      <div class="splash-content">
        <div class="splash-logo-container">
          <img
            src="/assets/logo.jpg"
            alt=""
            class="splash-logo"
            id="splash-logo"
            data-shell-i18n-alt="app.documentTitle"
          />
          <div class="splash-logo-glow"></div>
        </div>
        <h1 class="splash-title" data-shell-i18n-text="app.documentTitle"></h1>
        <p class="splash-version" data-shell-i18n-text="app.splash.version"></p>
        <div class="splash-loader">
          <div class="splash-progress" id="splash-progress"></div>
        </div>
        <p class="splash-status" id="splash-status" data-shell-i18n-text="app.startup.starting"></p>
      </div>
    </div>

    <div id="global-webview-container" class="app-offscreen-webviews">
      <webview
        id="ai0-webview"
        class="app-offscreen-webview"
        partition="persist:ai0"
        allowpopups
        spellcheck="false"
        webpreferences="spellcheck=false, backgroundThrottling=false, contextIsolation=true, nodeIntegration=false"
      ></webview>
      <webview
        id="ai1-webview"
        class="app-offscreen-webview"
        partition="persist:main"
        allowpopups
        spellcheck="false"
        webpreferences="spellcheck=false, backgroundThrottling=false, contextIsolation=true, nodeIntegration=false"
      ></webview>
      <webview
        id="ai2-webview"
        class="app-offscreen-webview"
        partition="persist:main"
        allowpopups
        spellcheck="false"
        webpreferences="spellcheck=false, backgroundThrottling=false, contextIsolation=true, nodeIntegration=false"
      ></webview>
    </div>

    <div class="side-nav-overlay" id="side-nav-overlay">
      <div class="side-nav-trigger"></div>
      <nav class="side-nav-menu">
        <button
          class="side-nav-btn active"
          data-page="entrance"
          title=""
          data-shell-i18n-title="sideNav.entranceTitle"
        >
          <span class="side-nav-icon">🏠</span>
          <span class="side-nav-label" data-shell-i18n-text="sideNav.entranceLabel"></span>

    <div class="livefix-countdown-overlay hidden" id="livefix-countdown-overlay">

        <div class="livefix-countdown-label" data-shell-i18n-text="livefix.secondsLabel"></div>
      </div>
    </div>
