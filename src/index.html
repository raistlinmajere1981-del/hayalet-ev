    <script>
      (() => {
        try {
          const uiMode =
            window.electronAPI?.getStartupFlags?.()?.uiMode === "scene" ? "scene" : "classic";
          document.documentElement.setAttribute("data-ui-mode", uiMode);
        } catch {
          document.documentElement.setAttribute("data-ui-mode", "classic");
        }
      })();
    </script>

    <script>
      (() => {
        const uiMode =
          document.documentElement.getAttribute("data-ui-mode") === "scene" ? "scene" : "classic";
        const splash = document.createElement("div");
        splash.id = "splash-screen";
        splash.className = "splash";
        splash.dataset.uiMode = uiMode;

        const classicMarkup = `
          <div class="splash-content">
            <div class="splash-logo-container">
              <img
                src="/assets/logo.jpg"
                alt=""
                class="splash-logo"
                id="splash-logo"
                data-shell-i18n-alt="app.documentTitle"
              />
              <div class="splash-logo-glow"></div>
            </div>
            <h1 class="splash-title" data-shell-i18n-text="app.documentTitle"></h1>
            <p class="splash-version" data-shell-i18n-text="app.splash.version"></p>
            <div class="splash-loader">
              <div class="splash-progress" id="splash-progress"></div>
            </div>
            <p class="splash-status" id="splash-status" data-shell-i18n-text="app.startup.starting"></p>
          </div>
        `;

        const sceneMarkup = `
          <div class="splash-content splash-content--scene">
            <div class="splash-scene-stage" id="splash-logo">
              <div class="splash-scene-door"></div>
            </div>
            <div class="splash-scene-copy">
              <div class="splash-loader">
                <div class="splash-progress" id="splash-progress"></div>
              </div>
              <p class="splash-status" id="splash-status" data-shell-i18n-text="app.startup.starting"></p>
            </div>
          </div>
        `;

        splash.innerHTML = uiMode === "scene" ? sceneMarkup : classicMarkup;
        document.body.insertBefore(splash, document.body.firstChild);
      })();
    </script>

                        data-shell-i18n-text="reportModal.title"
                      ></h3>
                    </div>
                  </div>

                  <div class="settings-panel-scroll settings-panel-scroll--live-log">
                    <div class="live-log-shell">
                      <div class="live-log-toolbar">
                        <div class="live-log-app-tabs" id="live-log-app-tabs">
                          <button
                            class="btn btn-ghost btn-sm is-active"
                            type="button"
                            data-app="app"
                          >
                            App
                          </button>
                          <button class="btn btn-ghost btn-sm" type="button" data-app="mcp-server">
                            MCP Server
                          </button>
                          <button class="btn btn-ghost btn-sm" type="button" data-app="ghost-agent">
                            Ghost Agent
                          </button>
                        </div>
                        <label class="live-log-control">
                          <span data-i18n-text="liveLog.sessionLabel"></span>
                          <select id="live-log-session-select" class="select select-sm"></select>
                        </label>
                        <label class="live-log-control">
                          <span data-i18n-text="liveLog.levelLabel"></span>
                          <select id="live-log-level-select" class="select select-sm">
                            <option value="all" data-i18n-text="liveLog.levels.all"></option>
                            <option value="error" data-i18n-text="liveLog.levels.error"></option>
                            <option
                              value="warning"
                              data-i18n-text="liveLog.levels.warning"
                            ></option>
                            <option value="info" data-i18n-text="liveLog.levels.info"></option>
                            <option
                              value="success"
                              data-i18n-text="liveLog.levels.success"
                            ></option>
                            <option value="debug" data-i18n-text="liveLog.levels.debug"></option>
                          </select>
                        </label>
                        <label class="live-log-control live-log-control-search">
                          <span data-i18n-text="liveLog.searchLabel"></span>
                          <input
                            class="input input-sm"
                            id="live-log-search"
                            type="search"
                            data-i18n-placeholder="liveLog.searchPlaceholder"
                          />
                        </label>
                        <div class="live-log-header-actions">
                          <div class="live-log-metrics" id="live-log-metrics"></div>
                          <button
                            class="btn btn-ghost btn-sm"
                            id="live-log-pause"
                            type="button"
                          ></button>
                          <button
                            class="btn btn-ghost btn-sm"
                            id="live-log-clear"
                            type="button"
                            data-i18n-text="liveLog.clear"
                            data-i18n-title="liveLog.clearTitle"
                          ></button>
                        </div>
                      </div>
                      <div class="live-log-body">
                        <div class="live-log-content" id="live-log-content"></div>
                        <div class="live-log-detail">
                          <div
                            class="live-log-detail-title"
                            data-i18n-text="liveLog.detailTitle"
                          ></div>
                          <div class="live-log-detail-meta" id="live-log-meta"></div>
                          <pre class="live-log-detail-context" id="live-log-context"></pre>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </section>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div
      class="toast-container"
      id="toast-container"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <div class="livefix-countdown-overlay is-hidden" id="livefix-countdown-overlay">
      <div class="livefix-countdown-card">
        <div class="livefix-countdown-icon">⚡</div>
        <div class="livefix-countdown-title" data-shell-i18n-text="livefix.restartTitle"></div>
        <div
          class="livefix-countdown-subtitle"
          id="livefix-countdown-subtitle"
          data-shell-i18n-text="livefix.appliedSubtitle"
        ></div>
        <div class="livefix-countdown-number" id="livefix-countdown-number">5</div>
        <div class="livefix-countdown-label" data-shell-i18n-text="livefix.secondsLabel"></div>
      </div>
    </div>
    <script type="module" src="/js/app/index.ts"></script>
  </body>
</html>
